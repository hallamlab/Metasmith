<title>E5 Workflow DAG</title>
<style>
/* One panel, full width: the solved E5 plan, nothing around it. */
:root {
  --bg: #f3f4f2; --panel: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #d5dad6;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --panel: #1c211e; --ink: #e3e8e5; --muted: #8e9993; --line: #2e3531; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1c211e; --ink: #e3e8e5; --muted: #8e9993; --line: #2e3531; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--display); padding-block: 24px; padding-inline: 16px; }
.panel { max-width: 1400px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.head h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
.head .key { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.dag { overflow: auto; padding: 18px; background: #ffffff; border-radius: 0 0 6px 6px; display: grid; justify-content: center; }
.dag svg { max-width: none; height: auto; }
</style>
