types:
  # The hybrid assembly pilot: one method from each school (graph resolution against polishing), scored against the source genomes.
  # Each assembly carries every property of sequences::assembly, so standard assembly consumers take them.

  long_read_platform:
    properties:
      _: the long reads' platform, which picks Flye's read mode (OXFORD_NANOPORE, OXFORD_NANOPORE_HQ, PACBIO_CLR, PACBIO_HIFI)
      e5: long_read_platform
      ext: json

  flye_assembly:
    properties:
      _: metaFlye contigs from the long reads alone (long-read first)
      e5: flye_assembly
      Format: FASTA
      Data: nucleic acid sequence
      ext: fna
      origin: assembler
  polca_assembly:
    properties:
      _: the metaFlye contigs after POLCA with the sample's short reads, the end of the long-read-first lane
      e5: polca_assembly
      Format: FASTA
      Data: nucleic acid sequence
      ext: fna
      origin: assembler
  # A type fence. MEGAHIT's contigs in a hybrid sample are OPERA-MS's input, not the sample's assembly:
  # without origin: assembler they satisfy no sequences::assembly requirement, so binners, ORF calling
  # and the viral lane can bind only OPERA-MS's contigs.
  megahit_draft:
    properties:
      _: MEGAHIT contigs that OPERA-MS scaffolds and gap-fills with the long reads
      e5: megahit_draft
      Format: FASTA
      Data: nucleic acid sequence
      ext: fna
  opera_ms_assembly:
    properties:
      _: OPERA-MS contigs, MEGAHIT's draft scaffolded and gap-filled with the long reads, unpolished (short-read first)
      e5: opera_ms_assembly
      Format: FASTA
      Data: nucleic acid sequence
      ext: fna
      origin: assembler

  source_genomes:
    properties:
      _: the study's CAMI source genomes as CAMI ships them, one gzipped tarball of FASTAs
      e5: source_genomes
      ext: tar.gz
  sample_references:
    properties:
      _: the file stems of the study's source genomes present in one sample, by its gold-standard assembly mapping
      e5: sample_references
      ext: json
  metaquast_report:
    properties:
      _: metaQUAST's combined and per-reference tables for one sample's assemblies side by side, as a gzipped tarball
      e5: metaquast_report
      ext: tar.gz
  quast_report:
    properties:
      _: reference-free QUAST tables for one sample's assemblies side by side, as a gzipped tarball
      e5: quast_report
      ext: tar.gz

  opera_ms.env:
    properties:
      e5: env
      provides: [opera_ms]
  masurca.env:
    properties:
      e5: env
      provides: [polca]
  quast.env:
    properties:
      e5: env
      provides: [quast]
