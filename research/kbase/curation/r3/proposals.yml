# ================================================================= variants
- verb: call_variants
  domain: variants
  status: missing
  proposals:
  - name: kbase/call_variants/bcftools_variants.py
    spec: Calls the positions where aligned reads disagree with the reference. Recovers the strain variation an assembly consensus collapses to one base.
    action: write
    consumes: [alignment::bam, sequences::assembly, env::bcftools.env]
    produces: [sequences::variant_calls]
    note: One KBase app, one narrative copy. A specific tool with a specific job, and last in the order.

# ================================================================= virus
- verb: identify_virus
  domain: annotation
  status: covered
  note: virsorter2, genomad and dramv.

# ================================================================= logistics
- verb: build_set
  domain: reads
  status: plumbing
  note: metasmith fans a transform out over its inputs. There is no set object to build.
- verb: manage_samples
  domain: reads
  status: plumbing
- verb: import_other
  domain: reads
  status: plumbing
- verb: export
  domain: reads
  status: plumbing
  note: Export is a deployment concern, not a transform.
- verb: view
  domain: reads
  status: plumbing
  note: 144 apps, all viewers. A metasmith product is a file, and rendering it is the GUI's job.

# ---------------------------------------------------------------------------
# Work that is not a transform.
refactors:
- name: Lift the ecology transforms out of the aspire namespace
  domain: ecology
  closes: [transform_matrix, ordinate, correlate_matrix, test_statistics, build_network]
  means: >-
    `diversity_analysis`, `spieceasi`, `graph_network`, `umap_clustering`,
    `measurement_association` and `paired_group_contrast` do every one of KBase's
    community-ecology operations. Each is gated on `aspire::run` and
    `aspire::analysis_counts`, so none can be reached from anything but that pipeline.
    `aspire/filter_table.py` and `create_count_matrix.py` already cross the boundary in
    both directions on `amplicon::asv_table`, which is the type to lift them onto.
    Five KBase verbs and 59 narrative copies close on one refactor rather than five
    transforms with no biological job.

- name: Ship a transcriptomics template
  domain: transcriptomics
  closes: []
  means: >-
    Eleven templates ship and none is transcriptomics, so eighteen transforms in that
    directory are exercised by nothing. `bowtie2_align` and `featurecounts` would make
    a bacterial chain end to end -- reads, bakta, alignment, counts, deseq2, volcano --
    which is the template to write and the thing that would prove the lane works.

- name: Decide whether a bin is an assembly
  domain: binning
  closes: [extract_bins]
  decided: round 6 -- NO, and derep_mag_ref now has a producer
  means: >-
    `sequences::bin_fasta` extends `putative_genome` and not `assembly`. One line either
    way, and it decides whether bin -> annotate -> build_model is walkable. Separately
    `binning::derep_mag_ref` is required by both instrain transforms and produced by
    nothing, which is a dangling requirement regardless of what is decided here.
  outcome: >-
    A bin is NOT an assembly. A bin is a mapping of contigs -- `binning::*_contig_to_bin_table`
    is that mapping -- and the FASTA is a materialisation to be avoided where it can be;
    annotation must not sit downstream of a bin, or every annotation is scoped to one
    binner's grouping and has to be redone when the grouping changes. The reason is now
    written at `bin_fasta` in `data_types/sequences.yml` and pointed at from the three
    tests that assert the negative, which is what stopped this being re-raised each round.
    `binning::derep_mag_ref` is produced by `binning/derep_mag_reference.py` as of the
    same round: `skani_dedup` already made the cluster table it is built from.

new_types:
  sequences::filtered_assembly:
    extends: [assembly]
    means: Contigs surviving a length or coverage filter.
  sequences::polished_assembly:
    extends: [assembly]
    means: Contigs corrected against short reads.
  sequences::min_contig_length:
    extends: []
    means: A scalar knob, the way `clustering::min_identity` already is.
  sequences::variant_calls:
    extends: []
    means: VCF against a named reference.
  annotation::homolog_hits:
    extends: []
    means: Tabular hits of a query set against a subject.
  annotation::gene_set:
    extends: []
    means: The gene identifiers an enrichment is computed over.
  annotation::go_overrepresentation:
    extends: []
    means: Hypergeometric over-representation of GO terms in a gene set.
  annotation::bakta_protein_hits:
    extends: []
    means: Per-ORF bakta calls -- locus, product, db_xrefs. The hit half of the pair.
  annotation::bakta_protein_inference:
    extends: []
    means: The evidence behind each call -- which database and at what identity. The definition half.
  annotation::bakta_hypotheticals:
    extends: []
    means: The ORFs bakta could not name, with their Pfam hits and physicochemical properties.
  annotation::bakta_protein_json:
    extends: []
    means: The full annotation record, for a consumer that wants more than the two tables.
  annotation::bakta_annotated_proteins:
    extends: []
    means: The input proteins re-emitted with bakta's names on their headers.
  annotation::bakta_feature_nt:
    extends: []
    means: Nucleotide sequence of every non-coding feature bakta called.
  annotation::bakta_summary:
    extends: []
    means: Per-genome feature counts and assembly statistics.
  taxonomy::gtdbtk_msa:
    extends: []
    means: GTDB-Tk's concatenated marker protein alignment.
  taxonomy::gtdbtk_tree:
    extends: []
    means: A newick phylogeny over the genomes GTDB-Tk aligned.
  comparative::msa:
    extends: []
    means: A multiple sequence alignment of user sequences.
  pangenome::ppanggolin_summary:
    extends: []
    means: Core, accessory and unique gene families with their functions.
  modelling::bigg_model_id:
    extends: []
    means: A BiGG model accession, the way ncbi::assembly_accession is an accession.
  transcriptomics::bowtie2_bam:
    extends: []
    means: Unspliced RNA-seq alignment against a bacterial reference.
  transcriptomics::expression_clusters:
    extends: []
    means: Gene clusters over a count table.
  modelling::metabolic_model:
    extends: [metabolomics::metabolic_model_sbml]
    means: >-
      A genome-scale reconstruction. Extending the metabolomics type is what lets
      `fba_constraint.py` consume it unchanged.
  modelling::media:
    extends: []
    means: A growth medium as a compound table. A deferred template input.
  modelling::gapfilled_model:
    extends: [modelling::metabolic_model]
    means: A model with universe reactions added until the medium supports growth.
  alignment::alignment_stats:
    extends: []
    means: Mapping rate, depth and insert size for one bam.
  modelling::fba_solution:
    extends: []
    means: A flux distribution and its objective value, one row per condition.

new_envs:
  env::mafft.env: mafft, for a bare multiple alignment.
  env::polypolish.env: polypolish, for short-read polishing of a long-read assembly.
  env::bcftools.env: bcftools, for variant calling.
  env::bowtie2.env: bowtie2, for unspliced RNA-seq alignment.
