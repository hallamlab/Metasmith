# Every KBase workspace type on the canonical grid -- curation round 2.
#
# One row per type referenced by any app spec, keyed by the workspace type name.
# `entity` names an entry in `types.yml`; every other key is an axis value that
# differs from that axis's default. A row carrying only an entity is the plain
# case, and that is most of them.
#
# The list is authored rather than derived. A regex over type names would put
# `KBaseSets.ExpressionSet` under expression and `KBaseRNASeq.RNASeqExpressionSet`
# somewhere else, and the whole point of the round is that those are one thing.
#
# `map_types.py` joins this against `catalog/types.jsonl` and fails when the two
# disagree, so a type added upstream cannot slip through unmapped.

version: r2

types:

  "*": {entity: unknown}
  KBaseMatrices: {entity: matrix}

  Communities.Collection: {entity: metagenome, cardinality: set, provenance: legacy}
