# The environment `resources/env/aspire.env` names: everything ASPIRE's vendored scripts
# import, in one env. Upstream spreads the same set over a dozen conda files, one per
# process, and they differ only in which subset of this they carry.
#
# R is here for run_indicspecies.R. The python half covers the SINA log parser and
# trimmer (biopython, tqdm), the table filter, the sankey (plotly 5, the last to export with kaleido 0.2.1,
# which bundles its own chromium for write_image), and every seaborn plot. SINA and
# vsearch stay in their own biocontainers.
name: aspire
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas=2.2.*
  - numpy
  - scipy
  - biopython
  - tqdm
  - matplotlib-base
  - seaborn
  - plotly=5.24.*
  - python-kaleido=0.2.1
  - r-base=4.4
  - r-indicspecies
  - r-optparse
  - r-dplyr
  - r-purrr
  - r-readr
  - r-tibble
  - r-tidyr
  - r-permute
  - procps-ng
