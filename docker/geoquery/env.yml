# One env for every POC adapter, pinned to the versions the October re-pull passed on.
name: geoquery
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4.*
  - pandas=3.0.*
  - pyarrow
  - rasterio=1.4.*
  - libgdal-core=3.12.*
  - pyproj=3.7.*
  - shapely=2.2.*
  - geopandas=1.2.*
  - pyogrio=0.12.*
  - pystac=1.15.*
  - pystac-client=0.9.*
  - requests=2.*
  - certifi
  - cryptography
  - fsspec
  - aiohttp
  - netcdf4
