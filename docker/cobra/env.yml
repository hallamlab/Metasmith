# The environment `resources/env/cobra.env` names. Deliberately the same spec as
# envs/fabfos/build-refs-cobra.yml, which is the conda arm of the same env file --
# an image and a conda env that disagree are two environments wearing one name.
#
# NUMPY<2 IS THE CONSTRAINT THAT KEEPS THIS OFF python_for_data_science. cobra's
# optlang stack and scikit-sparse/CHOLMOD need numpy<2; polars needs numpy>=2. The
# same split is why docker/fabfos carries two envs in one image and why
# docker/ecspr_bake splits :aam from :direction.
#
# `requests` is here because kbase/build_model/fetch_bigg_model.py reaches BiGG over
# HTTP. There is no curl in this image and none is wanted: a python fetch reports its
# own failure, where `curl | python` loses the status of the left-hand side.
name: cobra
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cobra=0.31.*
  - pandas=2.3.*
  - pyarrow>=24
  - numpy<2
  - scipy
  - requests
