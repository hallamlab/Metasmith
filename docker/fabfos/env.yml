# docker/fabfos's main env -- assembly + kofamscan/diamond + the ECSPr numeric stack.
#
# numpy<2 on purpose, matching envs/ecspr/base.yml and envs/build-refs-cobra.yml:
# scikit-sparse's CHOLMOD binding and cobra jointly require it, and CHOLMOD is the
# least portable member here -- conda-forge's `suitesparse` package is the reliable
# path to it, since this class of host has no libsuitesparse system libs and no
# working pip.
#
# ECSPr itself is NOT here. It has its own package, its own env spec and its own
# image (envs/ecspr/base.yml, docker/ecspr/); this env keeps the numeric stack only
# because the assembly and annotation lanes share the constraint.
#
# CLEAN and ProteinBERT are NOT here. Their weights have no standalone file in this
# repo -- they live only inside the bespoke external_clean/external_proteinbert images
# -- so they stay reference data on their own containers, same bucket as uniref/kofam/
# the ecspr_bake outputs. This env only carries what conda-forge/bioconda can install
# from a spec.
name: fabfos
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy<2
  - pandas=2.3.*
  - pyarrow>=24
  - scipy=1.17.*
  - scikit-sparse
  - cobra=0.31.*
  - requests
  # assembly
  - megahit
  - spades
  - flye
  - bbmap
  - filtlong
  - minimap2
  - samtools
  - bedtools
  - seqkit
  - hifiasm
  - hifiasm_meta
  - miniasm
  - bam2fastx
  - blast
  # annotation (conda-installable lanes only -- CLEAN/ProteinBERT excluded)
  - kofamscan
  - diamond
