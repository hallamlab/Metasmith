# generated by transforms/aspire/_generate.py -- do not hand-edit
# The ASPIRE amplicon pipeline's type graph.
#
# `_:` is a description AND a matched property, which is what keeps any two
# of these from accidentally standing in for one another.
types:
# -- the study keystone: what every stage descends from --
  study_metadata:
    properties:
      _: the study sample sheet, one row per sample, with the sample id first and a categorical label in every other column
      ext: tsv
      logistics: to group per-sample abundance profiles into one count table
  params:
    properties:
      _: ASPIRE read-to-ASV settings, keyed by step
      ext: yml
# -- study-level inputs the .nf read out of its config --
  sample_measurements:
    properties:
      _: numeric per-sample measurements, one row per sample keyed by the sample sheet's id
      ext: tsv
  mito_reference_source:
    properties:
      _: mitochondrial reference sequences for the mito BLAST database
      ext: fasta
  contaminant_reference_source:
    properties:
      _: contaminant/biofilm reference sequences for the contaminant BLAST database
      ext: fasta
# -- per-sample read processing --
  qc_reads:
    properties:
      _: fastp-trimmed amplicon reads for one sample
      ext: fastq.gz
  fastp_report_json:
    properties:
      _: fastp QC report for one sample
      ext: json
  fastp_report_html:
    properties:
      _: fastp QC report rendering for one sample
      ext: html
  filtered_fasta:
    properties:
      _: quality-filtered amplicon reads for one sample, merged when paired
      ext: fasta.gz
  read_counts:
    properties:
      _: per-sample read counts after merging and after quality filtering
      ext: tsv
# -- the study-level ASV spine --
  asv_filtered_counts:
    properties:
      _: ASV count matrix after prevalence and depth filtering
      ext: tsv
  asv_filtered_seqs:
    properties:
      _: ASV representative sequences surviving table filtering
      ext: fasta.gz
# -- SINA alignment and taxonomy --
  sina_trimmed_seqs:
    properties:
      _: SINA-aligned ASV sequences trimmed to the target variable regions
      ext: fasta.gz
  sina_aligned_seqs:
    properties:
      _: raw SINA alignment of the ASV sequences
      ext: fasta.gz
  sina_log:
    properties:
      _: SINA alignment log
      ext: log
  sina_v_regions:
    properties:
      _: per-sequence variable region assignments parsed from the SINA log
      ext: tsv
  taxonomy_uppercase_seqs:
    properties:
      _: ASV sequences uppercased for taxonomy assignment
      ext: fasta.gz
  taxonomy_stats:
    properties:
      _: taxonomy assignment summary statistics
      ext: tsv
# -- mitochondrial screen and decontamination --
  mitomaster_table:
    properties:
      _: MitoMaster classification of each ASV
      ext: tsv
  mito_blast6:
    properties:
      _: ASV hits against the mitochondrial database
      ext: tsv
  contaminant_blast6:
    properties:
      _: ASV hits against the contaminant database
      ext: tsv
  mito_summary_tables:
    properties:
      _: per-category summaries of the non-target call
      Data: directory
  mito_plots:
    properties:
      _: renderings of the non-target call
      Data: directory
# -- curation --
  counts_clean:
    properties:
      _: ASV counts with every non-target ASV removed
      ext: tsv
  counts_removed:
    properties:
      _: the counts curation removed, one reason per ASV
      ext: tsv
# -- read accounting --
  read_fate:
    properties:
      _: per-sample read counts at every stage from raw reads to clean counts
      ext: tsv
  sankey_outputs:
    properties:
      _: read-fate sankey renderings
      Data: directory
# -- metadata joins --
  metadata_mito:
    properties:
      _: study metadata joined to mitochondrial read accounting
      ext: tsv
  asv_meta_mito:
    properties:
      _: long-form ASV table joined to metadata and taxonomy, mitochondrial
      ext: tsv
  asv_final_mito:
    properties:
      _: analysis-ready mitochondrial ASV count matrix
      ext: tsv
# -- grouping diagnostics and soft labels --
  grouping_diagnostics_outputs:
    properties:
      _: group separability diagnostics and their renderings
      Data: directory
  soft_assignments:
    properties:
      _: soft group-label assignments for samples missing a hard label
      ext: tsv
  soft_validation:
    properties:
      _: per-sample validation of the soft label assignment
      ext: tsv
  soft_validation_summary:
    properties:
      _: summary of soft label assignment quality
      ext: tsv
# -- the three consumer-facing analysis channels --
  analysis_metadata:
    properties:
      _: study metadata joined to the microbial read accounting, as every analysis reads it
      ext: tsv
  analysis_asv_meta:
    properties:
      _: long-form microbial ASV table joined to metadata and taxonomy, as every analysis reads it
      ext: tsv
  analysis_counts:
    properties:
      _: the microbial ASV count matrix every analysis reads
      ext: tsv
# -- terminal analyses --
  upset_plots:
    properties:
      _: UpSet renderings of metadata group overlap
      Data: directory
  bubble_plots:
    properties:
      _: taxonomic bubble plot renderings
      Data: directory
  umap_plots:
    properties:
      _: UMAP clustering renderings
      Data: directory
  collectors_outputs:
    properties:
      _: collector's curve renderings
      Data: directory
  diversity_outputs:
    properties:
      _: alpha and beta diversity results and renderings
      Data: directory
  measurement_association_outputs:
    properties:
      _: ASV to continuous-measurement association results
      Data: directory
  clustermap_outputs:
    properties:
      _: abundance clustermap renderings
      Data: directory
# -- indicator species analysis --
  indicspecies_results:
    properties:
      _: indicator species results and summary, one pair of tables for each label of the sample sheet
      Data: directory
  indicspecies_tables:
    properties:
      _: every per-contrast indicator species table
      Data: directory
  indicspecies_plots:
    properties:
      _: indicator species renderings
      Data: directory
  indicspecies_aligned_plots:
    properties:
      _: indicator species renderings aligned across contrasts
      Data: directory
# -- co-occurrence network --
  external_graph_all:
    properties:
      _: pre-computed unthresholded co-occurrence graph, supplied instead of running SpiecEasi
      ext: graphml
  external_graph_thr:
    properties:
      _: pre-computed thresholded co-occurrence graph, supplied instead of running SpiecEasi
      ext: graphml
  external_node_features:
    properties:
      _: pre-computed network node features, supplied instead of running SpiecEasi
      ext: csv
  network_graph_all:
    properties:
      _: unthresholded positive co-occurrence graph
      ext: graphml
  network_graph_thr:
    properties:
      _: thresholded positive co-occurrence graph
      ext: graphml
  network_node_features:
    properties:
      _: per-node features of the co-occurrence graph
      ext: csv
  network_modules_sub:
    properties:
      _: module assignment over the thresholded graph
      ext: tsv
  network_modules_all:
    properties:
      _: module assignment over the unthresholded graph
      ext: tsv
  network_modules_summary:
    properties:
      _: per-module summary statistics
      ext: tsv
  network_modules_runs:
    properties:
      _: per-run record of the module detection sweep
      ext: tsv
  network_outputs:
    properties:
      _: co-occurrence network renderings and overlays
      Data: directory
# -- ASV to MAG linking --
  asv_mag_pairing:
    properties:
      _: ASV to MAG pairing table
      ext: tsv
  asv_mag_outputs:
    properties:
      _: ASV to MAG linking results
      Data: directory
  asv_mag_network_outputs:
    properties:
      _: MAG-annotated co-occurrence network renderings
      Data: directory
  module_asv_anchor_table:
    properties:
      _: per-ASV module anchor assignments
      ext: tsv
  module_mag_anchor_summary:
    properties:
      _: per-module MAG anchor summary
      ext: tsv
  sample_module_scores:
    properties:
      _: per-sample module activity scores
      ext: tsv
  sample_top_modules:
    properties:
      _: the highest scoring module per sample
      ext: tsv
  sample_module_matrix:
    properties:
      _: sample by module score matrix
      ext: tsv
  sample_module_heatmaps:
    properties:
      _: sample by module score heatmap renderings
      Data: directory
# -- master summary --
  master_long:
    properties:
      _: long-form master ASV table
      ext: tsv
  master_count_wide:
    properties:
      _: wide-form master count table
      ext: tsv
  master_source_manifest:
    properties:
      _: which stage contributed each master table column
      ext: tsv
  master_column_mapping:
    properties:
      _: original to canonical column name mapping
      ext: tsv
  master_column_collisions:
    properties:
      _: columns that collided during the master merge
      ext: tsv
# -- policy tokens --
# List-form properties, deliberately: mapping-form `extends:` is a key-wise
# merge the child wins, so a child restating any of the parent's keys stops
# satisfying it. A list is a set union, so subsumption always holds.
  spieceasi_policy:
    properties:
      - aspire-policy-spieceasi
  # do not infer the co-occurrence network with SpiecEasi rather than supplying one
  spieceasi_off:
    extends:
      - spieceasi_policy
    properties:
      - aspire-policy-spieceasi-off
  # infer the co-occurrence network with SpiecEasi rather than supplying one
  spieceasi_on:
    extends:
      - spieceasi_policy
    properties:
      - aspire-policy-spieceasi-on
  network_modules_policy:
    properties:
      - aspire-policy-network-modules
  # do not detect modules in the co-occurrence network
  network_modules_off:
    extends:
      - network_modules_policy
    properties:
      - aspire-policy-network-modules-off
  # detect modules in the co-occurrence network
  network_modules_on:
    extends:
      - network_modules_policy
    properties:
      - aspire-policy-network-modules-on
  asv_mag_link_policy:
    properties:
      - aspire-policy-asv-mag-link
  # do not link ASVs to MAGs
  asv_mag_link_off:
    extends:
      - asv_mag_link_policy
    properties:
      - aspire-policy-asv-mag-link-off
  # link ASVs to MAGs
  asv_mag_link_on:
    extends:
      - asv_mag_link_policy
    properties:
      - aspire-policy-asv-mag-link-on
  graph_network_policy:
    properties:
      - aspire-policy-graph-network
  # do not render and overlay the co-occurrence network
  graph_network_off:
    extends:
      - graph_network_policy
    properties:
      - aspire-policy-graph-network-off
  # render and overlay the co-occurrence network
  graph_network_on:
    extends:
      - graph_network_policy
    properties:
      - aspire-policy-graph-network-on
