# generated by transforms/aspire/_generate.py -- do not hand-edit
# The ASPIRE amplicon pipeline's type graph.
#
# `_:` is a description AND a matched property, which is what keeps any two
# of these from accidentally standing in for one another.
types:
# -- the run keystone: what every stage descends from --
  run:
    properties:
      _: one ASPIRE study; the grouping parent every stage descends from
      ext: txt
      logistics: to group per-sample abundance profiles into one count table
  sample_id:
    properties:
      _: label for one sequenced sample within an ASPIRE run
      ext: txt
# -- study-level inputs the .nf read out of its config --
  sample_metadata:
    properties:
      _: study metadata table, one row per sample
      ext: tsv
  sina_arb_reference:
    properties:
      _: SILVA ARB reference SINA aligns against
      ext: arb
  silva_ref_taxonomy:
    properties:
      _: SILVA reference taxonomy map for taxonomy assignment
      ext: tsv
  mito_reference_source:
    properties:
      _: mitochondrial reference sequences for the mito BLAST database
      ext: fasta
  contaminant_reference_source:
    properties:
      _: contaminant/biofilm reference sequences for the contaminant BLAST database
      ext: fasta
# -- per-sample read processing --
  qc_reads_fwd:
    properties:
      _: fastp-trimmed forward reads for one sample
      ext: fastq.gz
  qc_reads_rev:
    properties:
      _: fastp-trimmed reverse reads for one sample
      ext: fastq.gz
  fastp_report_json:
    properties:
      _: fastp QC report for one sample
      ext: json
  fastp_report_html:
    properties:
      _: fastp QC report rendering for one sample
      ext: html
  filtered_fasta:
    properties:
      _: quality-filtered merged reads for one sample
      ext: fasta.gz
# -- the run-level ASV spine --
  concat_counts_fasta:
    properties:
      _: all samples' filtered reads concatenated with sample-relabelled headers, for counting
      ext: fasta.gz
  centroids_fasta:
    properties:
      _: UNOISE denoised centroids
      ext: fasta.gz
  nochimera_fasta:
    properties:
      _: chimera-filtered centroids
      ext: fasta.gz
  asv_filtered_counts:
    properties:
      _: ASV count matrix after prevalence and depth filtering
      ext: tsv
  asv_filtered_seqs:
    properties:
      _: ASV representative sequences surviving table filtering
      ext: fasta.gz
# -- SINA alignment and taxonomy --
  sina_trimmed_seqs:
    properties:
      _: SINA-aligned ASV sequences trimmed to the target variable regions
      ext: fasta.gz
  sina_aligned_seqs:
    properties:
      _: raw SINA alignment of the ASV sequences
      ext: fasta.gz
  sina_log:
    properties:
      _: SINA alignment log
      ext: log
  sina_v_regions:
    properties:
      _: per-sequence variable region assignments parsed from the SINA log
      ext: tsv
  taxonomy_uppercase_seqs:
    properties:
      _: ASV sequences uppercased for taxonomy assignment
      ext: fasta.gz
  taxonomy_stats:
    properties:
      _: taxonomy assignment summary statistics
      ext: tsv
# -- mitochondrial screen and decontamination --
  mitomaster_table:
    properties:
      _: MitoMaster classification of each ASV
      ext: tsv
  mito_blast6:
    properties:
      _: ASV hits against the mitochondrial database
      ext: tsv
  contaminant_blast6:
    properties:
      _: ASV hits against the contaminant database
      ext: tsv
  nontarget_table:
    properties:
      _: master table of ASVs judged non-target (mitochondrial or contaminant)
      ext: tsv
  mito_summary_tables:
    properties:
      _: per-category summaries of the non-target call
      Data: directory
  mito_plots:
    properties:
      _: renderings of the non-target call
      Data: directory
# -- count partitioning --
  counts_filtered:
    properties:
      _: ASV counts after non-target removal
      ext: tsv
  counts_micro:
    properties:
      _: ASV counts restricted to microbial ASVs
      ext: tsv
  counts_mito:
    properties:
      _: ASV counts restricted to mitochondrial ASVs
      ext: tsv
  counts_decon:
    properties:
      _: ASV counts with contaminant ASVs removed
      ext: tsv
# -- read-accounting statistics --
  fastq_stats:
    properties:
      _: per-sample raw read counts
      ext: tsv
  fastp_stats:
    properties:
      _: per-sample post-fastp read counts
      ext: tsv
  filtered_stats:
    properties:
      _: per-sample post-filter read counts
      ext: tsv
  concat_stats:
    properties:
      _: per-sample read counts entering the concatenated pool
      ext: tsv
  sankey_outputs:
    properties:
      _: read-fate sankey renderings
      Data: directory
# -- metadata joins --
  metadata_micro:
    properties:
      _: study metadata joined to microbial read accounting
      ext: tsv
  asv_meta_micro:
    properties:
      _: long-form ASV table joined to metadata and taxonomy, microbial
      ext: tsv
  asv_final_micro:
    properties:
      _: analysis-ready microbial ASV count matrix
      ext: tsv
  metadata_mito:
    properties:
      _: study metadata joined to mitochondrial read accounting
      ext: tsv
  asv_meta_mito:
    properties:
      _: long-form ASV table joined to metadata and taxonomy, mitochondrial
      ext: tsv
  asv_final_mito:
    properties:
      _: analysis-ready mitochondrial ASV count matrix
      ext: tsv
# -- grouping diagnostics and soft labels --
  grouping_diagnostics_outputs:
    properties:
      _: group separability diagnostics and their renderings
      Data: directory
  soft_assignments:
    properties:
      _: soft group-label assignments for samples missing a hard label
      ext: tsv
  soft_validation:
    properties:
      _: per-sample validation of the soft label assignment
      ext: tsv
  soft_validation_summary:
    properties:
      _: summary of soft label assignment quality
      ext: tsv
  augmentation_audit:
    properties:
      _: record of which metadata rows the soft labels changed
      ext: tsv
# -- the three consumer-facing analysis channels --
  analysis_metadata:
    properties:
      _: the metadata table every downstream analysis reads, augmented or not
      ext: tsv
  stage_asv_meta:
    properties:
      _: the ASV metadata table after label augmentation and before batch correction
      ext: tsv
  analysis_asv_meta:
    properties:
      _: the ASV metadata table every downstream analysis reads, corrected or not
      ext: tsv
  analysis_counts:
    properties:
      _: the ASV count matrix every downstream analysis reads, corrected or not
      ext: tsv
# -- batch correction diagnostics --
  asv_clr_selected:
    properties:
      _: CLR-transformed counts for the selected feature set
      ext: tsv
  asv_clr_after:
    properties:
      _: CLR-transformed counts after ConQuR correction
      ext: tsv
  asv_corrected_counts:
    properties:
      _: ConQuR-corrected relative abundances
      ext: tsv
  asv_corrected_counts_int:
    properties:
      _: ConQuR-corrected counts with a pseudocount, integer-valued
      ext: tsv
  asv_selected_counts:
    properties:
      _: relative abundances for the selected feature set
      ext: tsv
  correction_decision:
    properties:
      _: per-feature record of whether correction was applied
      ext: tsv
  correction_countspace_plot:
    properties:
      _: count-space preservation check for the correction
      ext: png
  correction_countspace_metrics:
    properties:
      _: count-space preservation metrics for the correction
      ext: tsv
  correction_umap_plot:
    properties:
      _: UMAP before and after correction
      ext: png
  correction_stats:
    properties:
      _: batch correction summary statistics
      ext: tsv
  umap_hdbscan_results:
    properties:
      _: UMAP embedding with HDBSCAN cluster assignments
      ext: tsv
# -- terminal analyses --
  upset_plots:
    properties:
      _: UpSet renderings of metadata group overlap
      Data: directory
  bubble_plots:
    properties:
      _: taxonomic bubble plot renderings
      Data: directory
  umap_plots:
    properties:
      _: UMAP clustering renderings
      Data: directory
  outlier_outputs:
    properties:
      _: sample outlier diagnostics
      Data: directory
  collectors_outputs:
    properties:
      _: collector's curve renderings
      Data: directory
  diversity_outputs:
    properties:
      _: alpha and beta diversity results and renderings
      Data: directory
  voc_correlation_outputs:
    properties:
      _: ASV to volatile-compound correlation results
      Data: directory
  measurement_association_outputs:
    properties:
      _: ASV to continuous-measurement association results
      Data: directory
  power_analysis_outputs:
    properties:
      _: group contrast statistical power analysis
      Data: directory
  taxonomy_group_association_outputs:
    properties:
      _: subject-aware taxonomy to group association results
      Data: directory
  paired_group_contrast_outputs:
    properties:
      _: paired within-subject group contrast results
      Data: directory
  clustermap_outputs:
    properties:
      _: abundance clustermap renderings
      Data: directory
# -- indicator species analysis --
  indicspecies_group1_summary:
    properties:
      _: indicator species summary for the primary grouping
      ext: tsv
  indicspecies_group2_summary:
    properties:
      _: indicator species summary for the secondary grouping
      ext: tsv
  indicspecies_group1_results:
    properties:
      _: full indicator species results for the primary grouping
      ext: tsv
  indicspecies_group2_results:
    properties:
      _: full indicator species results for the secondary grouping
      ext: tsv
  indicspecies_tables:
    properties:
      _: every per-contrast indicator species table
      Data: directory
  indicspecies_plots:
    properties:
      _: indicator species renderings
      Data: directory
  indicspecies_aligned_plots:
    properties:
      _: indicator species renderings aligned across contrasts
      Data: directory
# -- co-occurrence network --
  external_graph_all:
    properties:
      _: pre-computed unthresholded co-occurrence graph, supplied instead of running SpiecEasi
      ext: graphml
  external_graph_thr:
    properties:
      _: pre-computed thresholded co-occurrence graph, supplied instead of running SpiecEasi
      ext: graphml
  external_node_features:
    properties:
      _: pre-computed network node features, supplied instead of running SpiecEasi
      ext: csv
  network_graph_all:
    properties:
      _: unthresholded positive co-occurrence graph
      ext: graphml
  network_graph_thr:
    properties:
      _: thresholded positive co-occurrence graph
      ext: graphml
  network_node_features:
    properties:
      _: per-node features of the co-occurrence graph
      ext: csv
  network_modules_sub:
    properties:
      _: module assignment over the thresholded graph
      ext: tsv
  network_modules_all:
    properties:
      _: module assignment over the unthresholded graph
      ext: tsv
  network_modules_summary:
    properties:
      _: per-module summary statistics
      ext: tsv
  network_modules_runs:
    properties:
      _: per-run record of the module detection sweep
      ext: tsv
  network_outputs:
    properties:
      _: co-occurrence network renderings and overlays
      Data: directory
# -- ASV to MAG linking --
  asv_mag_pairing:
    properties:
      _: ASV to MAG pairing table
      ext: tsv
  asv_mag_outputs:
    properties:
      _: ASV to MAG linking results
      Data: directory
  asv_mag_network_outputs:
    properties:
      _: MAG-annotated co-occurrence network renderings
      Data: directory
  module_asv_anchor_table:
    properties:
      _: per-ASV module anchor assignments
      ext: tsv
  module_mag_anchor_summary:
    properties:
      _: per-module MAG anchor summary
      ext: tsv
  sample_module_scores:
    properties:
      _: per-sample module activity scores
      ext: tsv
  sample_top_modules:
    properties:
      _: the highest scoring module per sample
      ext: tsv
  sample_module_matrix:
    properties:
      _: sample by module score matrix
      ext: tsv
  sample_module_heatmaps:
    properties:
      _: sample by module score heatmap renderings
      Data: directory
# -- master summary --
  master_long:
    properties:
      _: long-form master ASV table
      ext: tsv
  master_count_wide:
    properties:
      _: wide-form master count table
      ext: tsv
  master_source_manifest:
    properties:
      _: which stage contributed each master table column
      ext: tsv
  master_column_mapping:
    properties:
      _: original to canonical column name mapping
      ext: tsv
  master_column_collisions:
    properties:
      _: columns that collided during the master merge
      ext: tsv
# -- policy tokens --
# List-form properties, deliberately: mapping-form `extends:` is a key-wise
# merge the child wins, so a child restating any of the parent's keys stops
# satisfying it. A list is a set union, so subsumption always holds.
  augmentation_policy:
    properties:
      - aspire-policy-augmentation
  # do not apply soft group labels to the metadata before analysis
  augmentation_off:
    extends:
      - augmentation_policy
    properties:
      - aspire-policy-augmentation-off
  # apply soft group labels to the metadata before analysis
  augmentation_on:
    extends:
      - augmentation_policy
    properties:
      - aspire-policy-augmentation-on
  batch_correction_policy:
    properties:
      - aspire-policy-batch-correction
  # do not run ConQuR batch correction over the ASV counts
  batch_correction_off:
    extends:
      - batch_correction_policy
    properties:
      - aspire-policy-batch-correction-off
  # run ConQuR batch correction over the ASV counts
  batch_correction_on:
    extends:
      - batch_correction_policy
    properties:
      - aspire-policy-batch-correction-on
  indicspecies_policy:
    properties:
      - aspire-policy-indicspecies
  # do not run indicator species analysis
  indicspecies_off:
    extends:
      - indicspecies_policy
    properties:
      - aspire-policy-indicspecies-off
  # run indicator species analysis
  indicspecies_on:
    extends:
      - indicspecies_policy
    properties:
      - aspire-policy-indicspecies-on
  spieceasi_policy:
    properties:
      - aspire-policy-spieceasi
  # do not infer the co-occurrence network with SpiecEasi rather than supplying one
  spieceasi_off:
    extends:
      - spieceasi_policy
    properties:
      - aspire-policy-spieceasi-off
  # infer the co-occurrence network with SpiecEasi rather than supplying one
  spieceasi_on:
    extends:
      - spieceasi_policy
    properties:
      - aspire-policy-spieceasi-on
  network_modules_policy:
    properties:
      - aspire-policy-network-modules
  # do not detect modules in the co-occurrence network
  network_modules_off:
    extends:
      - network_modules_policy
    properties:
      - aspire-policy-network-modules-off
  # detect modules in the co-occurrence network
  network_modules_on:
    extends:
      - network_modules_policy
    properties:
      - aspire-policy-network-modules-on
  asv_mag_link_policy:
    properties:
      - aspire-policy-asv-mag-link
  # do not link ASVs to MAGs
  asv_mag_link_off:
    extends:
      - asv_mag_link_policy
    properties:
      - aspire-policy-asv-mag-link-off
  # link ASVs to MAGs
  asv_mag_link_on:
    extends:
      - asv_mag_link_policy
    properties:
      - aspire-policy-asv-mag-link-on
  graph_network_policy:
    properties:
      - aspire-policy-graph-network
  # do not render and overlay the co-occurrence network
  graph_network_off:
    extends:
      - graph_network_policy
    properties:
      - aspire-policy-graph-network-off
  # render and overlay the co-occurrence network
  graph_network_on:
    extends:
      - graph_network_policy
    properties:
      - aspire-policy-graph-network-on
  sankey_policy:
    properties:
      - aspire-policy-sankey
  # do not render the read-fate sankey
  sankey_off:
    extends:
      - sankey_policy
    properties:
      - aspire-policy-sankey-off
  # render the read-fate sankey
  sankey_on:
    extends:
      - sankey_policy
    properties:
      - aspire-policy-sankey-on
