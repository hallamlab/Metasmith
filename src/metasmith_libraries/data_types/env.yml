  # -------------------------------------------------
  # reference-build environments (build_references/)
  #
  # These four exist because the metabolism bake's members cannot co-reside: rdkit for
  # the atom-mapping ensemble, equilibrator and dGbyG for the two thermodynamic members
  # of the direction ensemble, and cobra for anything that opens a curated GEM. The last
  # one is why the curated-GEM lane could not be built inside ecspr:2026.07.14, which
  # carries no cobra; the image ecspr.env now names does, but the four stay split
  # because rdkit and the two thermodynamic members still cannot co-reside.
  #
  # THE TWO THERMODYNAMIC MEMBERS SPLIT ON PYTHON, NOT ON NUMPY. numpy is what separates
  # rdkit.env from the other two (torch 2.2.1 is a numpy 1.x C-API build, equilibrator-
  # cache 0.7.1 floors numpy at 2). dGbyG is separate from equilibrator because its
  # source needs python 3.12 to parse while the eQuilibrator stack is pinned at 3.11 --
  # under 3.11 it installs and then raises SyntaxError at import.
  rdkit.env:
    extends: env
    properties:
      provides:
      - rdkit
      - rxnmapper
      - localmapper
  equilibrator.env:
    extends: env
    properties:
      provides:
      - equilibrator-api
  dgbyg.env:
    extends: env
    properties:
      provides:
      - dgbyg
  cobra.env:
    extends: env
    properties:
      provides:
      - cobra

