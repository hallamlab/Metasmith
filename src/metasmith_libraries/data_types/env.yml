types:
  # A tool environment. The resource file (resources/env/<tool>.env) is YAML
  # with an optional `container:` (a docker:// OCI URI, used by the DOCKER /
  # APPTAINER runtimes) and/or an optional `conda:` (a conda/mamba env name,
  # used by the MAMBA runtime). The engine selects which by the global runtime.
  env:
    properties:
      _: generic tool environment (container and/or conda); see resources/env/*.env
  # proxy target for the transform that prefetches container images
  # for HPC platforms where compute nodes don't have internet access
  pulled_container:
    properties:
      ext: log
      atomic_description: pulled OCI container
  # -------------------------------------------------
  # format conversion
  bam2fastx.env:
    extends: env
    properties:
      provides:
