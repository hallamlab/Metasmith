# Genome-scale metabolic reconstruction and flux.
# Added by curation round 3 -- see research/kbase/curation/r3/proposals.yml.
#
# This namespace DOES connect to `metabolomics::metabolic_model_sbml`, as of curation
# round 6. Rounds 3 to 5 read `test_type_hierarchy.py::test_no_cross_file_extends` --
# no `extends` may name a type in another file -- as closing the question, and left
# `fba_constraint.py` requiring a type nothing produced while two transforms produced
# its twin. But matching never needed `extends`: a type satisfies another when its
# property set is a SUPERSET, and that is cross-file capable. The two already agreed
# on `Format` and `ext` and differed only in `_`, which is a matched property and not
# a description. Aligning `_` is the whole join; the prose moved into this comment,
# where it cannot stop a match. No converter transform, and `extends` stays in-file.
types:
  # A genome-scale metabolic reconstruction. Equal, as a property set, to
  # `metabolomics::metabolic_model_sbml` -- deliberately, because they are the same
  # artifact under two names, and equality is what lets `fetch_bigg_model` and
  # `gem_from_gpr` feed `metabolicModelling/fba_constraint.py`.
  metabolic_model:
    properties:
      _: SBML genome-scale metabolic model file
      Format: SBML
      ext: xml
  # a reconstruction with universe reactions added until the medium supports growth.
  # The prose is a COMMENT and not a `_` property on purpose: `extends` is a key-wise
  # merge in which the child wins, so a child that restates `_` overwrites the parent's
  # description and stops satisfying the parent it extends.
  #
  # TWO PRODUCERS as of the CarveMe route (`transforms/metabolicModelling/carveme_gapfill.py`):
  # `kbase/gapfill_model/cobra_gapfill.py` answers "what is the fewest reactions this
  # draft needs, restricted to metabolites it already has" and the CarveMe route answers
  # "what does an unrestricted MetaNetX universe add" -- deliberately different
  # questions, not two paths to the same answer. Targets and lineage cannot distinguish
  # two producers of one type (see `AGENTS.md` "Two producers need a masked library"),
  # so a template wanting a SPECIFIC one must pin that transform explicitly rather than
  # name `gapfilled_model` and let the planner choose.
  gapfilled_model:
    extends:
    - metabolic_model
    properties:
      gapfilled: true
  media:
    properties:
      _: a growth medium as a compound table; a deferred template input
      Format: TSV
      ext: tsv
  # The `medium` column value a caller selects out of a `media` table, the way
  # `bigg_model_id` below is an accession rather than a database.
  # `carveme_from_orfs.py` used to fix this to a literal "M9" in the shell
  # command because the only worked example carried a single medium named
  # that; a driver registering a multi-medium table now names the row through
  # this type instead of editing the transform. `carveme_gapfill.py` still
  # hardcodes "M9" the same way -- out of scope here, left for a future pass.
  medium_name:
    properties:
      _: a medium name, matching the `medium` column of a modelling::media table; a deferred template input
      arity: 1
      ext: txt
  fba_solution:
    properties:
      _: a flux distribution and its objective value, one row per condition
      Format: CSV
      ext: csv
  bigg_model_id:
    properties:
      _: a BiGG model accession, the way ncbi::assembly_accession is an accession
      arity: 1
      ext: txt
  # -------------------------------------------------
  # The CarveMe route: GPR draft -> borrowed biomass -> native transport -> CarveMe
  # gapfill. Each intermediate stage gets its OWN type with a SINGLE producer, rather
  # than reusing `metabolic_model` at every step, so a template naming one of these
  # is unambiguous by construction -- the only deliberately ambiguous join in this
  # route is the final `gapfilled_model` it shares with `cobra_gapfill.py` (see that
  # type's comment above).
  #
  # CarveMe's OWN universe file, read only for its `Growth` reaction (57 metabolites
  # over `universe_bacteria.xml.gz`, 64 over `universe_gramneg.xml.gz`) -- never for
  # its 1,870 BiGG-namespaced transporters, which `carveme_transport.py` deliberately
  # does not map. `fetch_carveme_universe.py` is its only producer.
  carveme_universe:
    properties:
      _: CarveMe's shipped reaction universe SBML (bacteria or gramneg), borrowed only for its Growth biomass reaction
      Format: SBML
      ext: xml.gz
  # A draft (`metabolic_model`) with CarveMe's `Growth` biomass mapped into MNXM and
  # added as the objective. Still single-compartment: nothing here can be consumed or
  # produced yet, because the transport boundary does not exist until the next stage.
  biomass_model:
    extends:
    - metabolic_model
    properties:
      carveme_biomass: true
  # `biomass_model` plus an `e` compartment, the native MNXR transporters and
  # exchange reactions `carveme_transport.py` decided the medium and biomass
  # precursors need, and nothing else -- see that script's own comment for why
  # "nothing else" is the deliberate half of the design.
  transport_model:
    extends:
    - metabolic_model
    properties:
      carveme_biomass: true
      carveme_transport: true
  # An unrestricted, single-compartment MetaNetX reaction universe for CarveMe's own
  # gapfill MILP -- the deliberate opposite of `cobra_gapfill.py`'s universe, which
  # keeps only reactions whose metabolites the draft already has. See
  # `build_mnx_universe.py`'s docstring for why unrestricted is the point.
  mnx_gapfill_universe:
    properties:
      _: an unrestricted single-compartment MetaNetX reaction universe, for CarveMe's gapfill MILP
      Format: SBML
      ext: xml
  # -------------------------------------------------
  # The metaGEM-parity route: `carve --fbc2 -g <medium>` run directly on predicted
  # ORFs -- metaGEM is a Snakemake workflow, not a tool, and THIS is its
  # reconstruction step. It shares no stage with the CarveMe route above: no
  # borrowed biomass, no native MNXR transport, no MetaNetX universe -- CarveMe's
  # own bundled bacteria universe supplies all three internally, the same way it
  # does for any standalone `carve` invocation. Output ids stay in CarveMe's OWN
  # BiGG namespace (R_/M_-prefixed, the same prefix every `carve` run produces,
  # not an artifact of this repo's MNXM pipeline), so nothing here needs
  # `carveme_gapfill.py`'s `strip_reframed_prefix` step.
  #
  # A DISTINCT type from `gapfilled_model`, not a third producer of it -- see
  # `AGENTS.md` "Two producers need a masked library": that type already has two
  # producers a template must pin between by naming the transform, and this
  # route answers a THIRD, again different question ("what does homology to the
  # BiGG gene set alone support, with no GPR table at all"). It deliberately
  # carries NO `gapfilled` property, so it satisfies `metabolic_model` -- which
  # is what `memote_score.py` targets, to score every lane through one
  # transform -- without silently becoming answerable for a `gapfilled_model`
  # target the planner would then be free to route here instead of either
  # existing producer.
  carveme_model:
    extends:
    - metabolic_model
    properties:
      carveme_from_orfs: true
  # -------------------------------------------------
  # The CPLEX parity variant of the metaGEM-parity route above, on the
  # commercial solver metaGEM itself gap fills with -- see
  # `carveme_from_orfs_cplex.py`'s own comment for why the CPLEX path is a
  # SEPARATE transform+type rather than a flag on `carveme_from_orfs.py`: the
  # shipped path must keep answering `modelling::carveme_model` unconditionally,
  # and this route is reached only when a target names THIS type by name and a
  # driver has registered `cplex_installation` -- the same way
  # `research/cami/run_cami_metag.py` registers its reference database paths.
  # A DISTINCT product type, not a second producer of `carveme_model`, for the
  # reason every other stage in this file gives: two producers of one type are
  # a target the planner can silently answer wrong (see AGENTS.md "Two
  # producers need a masked library"). `carveme_from_orfs: cplex` -- a
  # different VALUE from `carveme_model`'s `carveme_from_orfs: true`, the same
  # trick `orf_chunk`/`orf_batch` use against `orfs`'s `granularity: whole` --
  # is what keeps this a true sibling rather than a property-superset: an
  # instance of this type does NOT satisfy a plain `carveme_model` requirement
  # (the value disagrees), so the shipped path cannot be silently rerouted
  # here. Both siblings still satisfy the common `metabolic_model` supertype,
  # which is what lets `memote_score.py` score either lane.
  carveme_model_cplex:
    extends:
    - metabolic_model
    properties:
      carveme_from_orfs: cplex
  # The private, size-uncapped CPLEX 22.2.0.0 Python 3.12 runtime (the `cplex`
  # and `docplex` packages, already run through `docplex config --upgrade`
  # against the entitled Studio installation -- the packaged module alone
  # silently caps at 1000 variables/constraints, CPLEX error 1016). Lives on
  # the cluster, not in this repo, so a driver `RegisterItem`s a real path the
  # way `research/cami/run_cami_metag.py`'s `DB_PATHS` does -- never DEFERRED.
  # `carveme_from_orfs_cplex.py` binds it into the container and puts it on
  # PYTHONPATH; nothing here copies it to node-local scratch itself, which is
  # the driver's job (see that transform's comment).
  cplex_installation:
    properties:
      _: a directory holding the full CPLEX 22.2.0.0 Python runtime (cplex + docplex), upgraded past the Community Edition size cap
  # -------------------------------------------------
  # MEMOTE, over EITHER GEM lane -- it requires the common supertype
  # `metabolic_model` rather than `gapfilled_model` or `carveme_model` by name,
  # so one transform scores both without knowing either exists. MEMOTE degrades
  # gracefully with no biomass reaction (skipped tests, not failed ones -- 20
  # collected vs 10 without one, observed against a draft with no objective), so
  # scoring a lane ahead of its own gapfill step is not a bug.
  #
  # `memote run` and `memote report snapshot` each re-run pytest independently and
  # neither file carries a top-level score -- the CLI computes it only inside the
  # report path, by mutating the very results object it renders from. See
  # `resources/env/memote.env`'s comment and `memote_score.py`'s docstring for
  # why one test execution here produces all three products below rather than two
  # (matching MEMOTE's own two CLI commands) or none (the honest fallback the
  # brief for this type allowed, had reusing MEMOTE's own scorer not been this
  # direct).
  memote_report:
    properties:
      _: MEMOTE's own HTML report -- `memote report snapshot`'s output, rendered from one test run
      Format: HTML
      ext: html
  memote_results:
    properties:
      _: the raw MEMOTE test result, exactly what `memote run --filename result.json.gz` writes -- no score section
      Format: JSON
      ext: json.gz
  memote_score:
    properties:
      _: MEMOTE's own total_score plus its per-section breakdown, computed by Report.compute_score() and not re-derived here
      Format: JSON
      ext: json
