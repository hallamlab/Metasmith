types:
  # A licensed tool exactly as its user downloaded it. Nothing produces one: the
  # user gives it as an input, a build transform turns it into the tool's env
  # image once, and the cache keeps that image. It is never redistributed, so
  # no published image carries one. `obtain_from` is what a failed plan names
  # when a lane needs a package nobody gave (see the engine's plan hints).
  package:
    properties:
      _: licensed tool as downloaded by its user; never redistributed
  pathway_tools_package:
    extends: package
    properties:
      _: Pathway Tools 27.0 Linux installer from SRI (pathway-tools-27.0-linux-64-tier1-install)
      obtain_from: https://biocyc.org/download-bundle.shtml
  signalp6_package:
    extends: package
    properties:
      _: SignalP 6.0 archive from DTU Health Tech (signalp-6.0*.fast.tar.gz or slow_sequential)
      obtain_from: https://services.healthtech.dtu.dk/cgi-bin/sw_request?software=signalp&version=6.0&packageversion=6.0i&platform=fast
  deeptmhmm_package:
    extends: package
    properties:
      _: DeepTMHMM 1.0 academic package (DeepTMHMM-Academic-License-v1.0.zip)
      obtain_from: https://dtu.biolib.com/DeepTMHMM
  phobius_package:
    extends: package
    properties:
      _: Phobius 1.01 standalone archive (phobius101_linux.tgz)
      obtain_from: https://phobius.sbc.su.se/download
