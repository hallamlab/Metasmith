types:
  experiment:
    properties:
      logistics: to group samples into a transcriptomics experiment
  salmon_index:
    properties:
      _: salmon quasi-mapping index
  salmon_quant:
    properties:
      _: salmon quantification output
      ext: sf
  count_table:
    properties:
      _: normalized count table
      ext: tsv
  diff_count_table:
    properties:
      _: DESeq2-normalized count table for differential expression
      ext: tsv

  # --- Eukaryotic pipeline types ---
  star_index:
    properties:
      _: STAR genome index for splice-aware alignment
  star_bam:
    properties:
      _: STAR-aligned coordinate-sorted BAM
      ext: bam
  stringtie_gtf:
    properties:
      _: StringTie per-sample transcript assembly
      ext: gtf
  merged_gtf:
    properties:
      _: StringTie merged transcript annotation across all samples
      ext: gtf
  stringtie_quant_gtf:
    properties:
      _: StringTie quantified transcript GTF with expression estimates
      ext: gtf
  gene_count_table:
    properties:
      _: gene-level count matrix from StringTie
      ext: csv
  deseq2_results:
    properties:
      _: DESeq2 differential expression results for all pairwise comparisons
      ext: csv
  merged_bam:
    properties:
      _: merged BAM from all samples in an experiment
      ext: bam
  volcano_plot:
    properties:
      _: interactive volcano plot of pairwise differential expression
      ext: html
  volcano_plot_png:
    properties:
      _: static volcano plot image of pairwise differential expression
      ext: png
  braker3_gff:
    properties:
      _: Braker3 gene predictions in GFF3 format
      ext: gff3
  braker3_proteins:
    properties:
      _: Braker3 predicted protein sequences
      ext: faa

  # --- Organellar pipeline types ---
  organellar_reference:
    properties:
      _: organellar reference genome FASTA extracted from GenBank
      Format: FASTA
      ext: fna
  organellar_gff:
    properties:
      _: organellar gene annotation in GFF3 format
      Format: GFF3
      ext: gff3
  organellar_bam:
    properties:
      _: RNA-seq reads aligned to organellar reference
      ext: bam
  organellar_gene_count_table:
    properties:
      _: organellar gene-level count matrix
      ext: csv
  contamination_report:
    properties:
      _: BLAST-based contamination check report
      Format: TSV
      ext: tsv

  # --- curation round 3 -- KBase parity ---
  # An `alignment::bam` by subsumption, not by `extends`: `extends` cannot name a type
  # in another file (`test_no_cross_file_extends`) but matching never needed it -- a
  # property SUPERSET satisfies. So `_` and `ext` are alignment::bam's, restated, and
  # what this type is beyond a bam lives in `method:`. Putting the prose back into `_`
  # is what kept the two apart for three rounds: `_` is a matched property, and a
  # different value stops satisfying.
  #
  # The other three bams in this file deliberately do NOT join. `star_bam` and the
  # `merged_bam` built from it descend from `sequences::assembly` through `star_index`,
  # so the lineage constraint on metabat2/semibin2/comebin and bcftools_variants would
  # NOT stop a splice-aware RNA aligner's output being read as coverage or as evidence
  # for a variant call. Only the type does. `organellar_bam` is an alignment against an
  # organelle, which is not the reference anything downstream of an `alignment::bam`
  # believes it has. Curation round 6.
  bowtie2_bam:
    properties:
      _: binary alignment map
      ext: bam
      method: bowtie2
  expression_clusters:
    properties:
      _: gene clusters over a count table
      Format: TSV
      ext: tsv
  clustering_params:
    properties:
      _: 'the method knob a gene clustering is run at -- method is hierarchical or kmeans, k is an int or null for estimate-by-silhouette'
      arity: 1
      Format: JSON
      ext: json
