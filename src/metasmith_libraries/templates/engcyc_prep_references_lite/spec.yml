name: engcyc_prep_references_lite
description: 'Fetches and builds every reference database and tool image that

  engcyc_metagenomics_lite needs, and takes no samples. Run it once on an agent before

  the real run; engcyc_metagenomics_lite then finds these products in the cache. Its

  targets are engcyc_metagenomics_lite''s references case. The plan summary shows
  the

  download total.'
transform_libraries:
- logistics
- assembly
- metagenomics
- functionalAnnotation
- viromics
- metabolicModelling
resource_libraries:
- env
- lib
