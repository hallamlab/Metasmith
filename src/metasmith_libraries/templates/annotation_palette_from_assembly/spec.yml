name: annotation_palette_from_assembly
description: 'Run the broadest feasible set of annotators against an existing assembly:

  KOFAMSCAN, DIAMOND UniRef50, eggNOG-mapper and ProteinBERT on its ORFs, plus

  Metabuli contig-level taxonomy.'
sample_type: sequences::assembly
target_types:
- annotation::kofamscan_results
- annotation::kofamscan_descriptions
- annotation::diamond_uniref50_results
- annotation::diamond_uniref50_descriptions
- annotation::eggnog_results
- annotation::proteinbert_embeddings
- taxonomy::metabuli
transform_libraries:
- logistics
- metagenomics
- functionalAnnotation
resource_libraries:
- env
shared_input_paths:
- eggnog_source.marker
input_library:
  schema: v1
  manifest:
    /msm_deferred/801362b132b047d7b5f5e83ae7001c5c:
      type: sequences::assembly
      instance_id: 1e20e9d7bbbd8ec0d30df951ffa66670c250363cc454b571d1e90ea203bf38be160e
      origin: leaf
    eggnog_source.marker:
      type: annotation::eggnog_source
      instance_id: 1e20d5223cce30ae1e9e4a66319bc6f1edb45da822a588d3173e43b9e1625f14c38a
      origin: leaf
  values:
    eggnog_source.marker: trigger
