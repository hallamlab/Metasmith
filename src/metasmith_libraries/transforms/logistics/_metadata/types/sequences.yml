ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  100x_long_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      coverage: 100x
      ext: fq.gz
      pair_state: complete
      parity: single
      qc: read_depth_stratified
      read_length: long
  assembly:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      ext: fna
      origin: assembler
  assembly_per_bp_coverage:
    properties:
      _:
      - assembly per bp coverage
      ext: gz
  assembly_per_contig_coverage:
    properties:
      _:
      - assembly per contig coverage
      ext: tsv
  assembly_stats:
    properties:
      _:
      - assembly stats
      ext: json
      fields:
      - GC
      - N50
      - fraction_reads_mapped
      - length
      - number_of_contigs
  bin_fasta:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - a single metagenomic bin FASTA file
      ext: fna
      genome_scope: single
  boltz_structures:
    properties:
      Format: mmCIF
      _:
      - Boltz-2 predicted structures (tar of mmCIF files)
      ext: tar.gz
  chromosomal_contig:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - curated single-chromosome contig from a long-read assembly
      ext: fna
      genome_scope: single
      origin: long_read_pseudo_bin
  clean_long_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      parity: single
      qc: filtered
      read_length: long
  clean_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      qc: filtered
  clean_short_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      qc: filtered
      read_length: short
  clean_short_reads_pe:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      parity: interleaved
      qc: filtered
      read_length: short
  clean_short_reads_se:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      parity: single
      qc: filtered
      read_length: short
  comebin_bin_fasta:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - a single metagenomic bin FASTA file
      ext: fna
      genome_scope: single
      method: comebin
  contig_batch:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - Fixed-size (~5 Mbp) batch of a per-sample contig FASTA; fans out contig-level
        annotators (genomad, virsorter2, integron_finder). Distinct sibling of assembly
        (NOT a subtype, like orf_chunk to orfs) so the solver routes batches only
        to batch-consuming contig tools, never to whole-assembly consumers. Headers
        are reversibly sample-prefixed (SG<id>~k141_N) by w4_rebatch.py; w4_recompile.py
        strips the prefix + regroups results per sample.
      ext: fna
      granularity: batch
  discarded_long_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      parity: single
      qc: discarded
      read_length: long
  discarded_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      qc: discarded
  discarded_short_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      qc: discarded
      read_length: short
  fastqc_html_report:
    properties:
      _:
      - fastqc html report
      ext: html
  fastqc_raw_report:
    properties:
      _:
      - fastqc raw report
      ext: zip
  flye_assembly:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      ext: fna
      method: flye
      origin: assembler
  flye_raw_assembly:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      ext: fna
      method: flye using raw reads
      origin: assembler
  forward_ora_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      compression: ora
      direction: forward
      ext: fastq.ora
      pair_state: half
      parity: paired end
      qc: none
      read_length: short
  forward_short_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      compression: none
      direction: forward
      ext: fq
      pair_state: half
      parity: paired end
      qc: none
      read_length: short
  gbk:
    properties:
      Format: genbank file
      ext: gbk
  gff:
    properties:
      Format: gene feature format
      ext: gff
  hifiasm_meta_assembly:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      ext: fna
      method: hifiasm-meta
      origin: assembler
  isolate_assembly:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      ext: fna
      genome_scope: single
      origin: assembler
      subject: isolate
  long_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      parity: single
      qc: none
      read_length: long
  megahit_assembly:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      ext: fna
      method: megahit
      origin: assembler
  metabat2_bin_fasta:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - a single metagenomic bin FASTA file
      ext: fna
      genome_scope: single
      method: metabat2
  miniasm_gfa:
    properties:
      Format: graphical fragment assembly
      _:
      - miniasm rough assembly
      ext: gfa
  nanoplot_html_report:
    properties:
      _:
      - nanoplot html report
      ext: html
  nanoplot_raw_report:
    properties:
      _:
      - nanoplot raw report
      ext: gz
  orf_batch:
    properties:
      Data: protein sequence
      Format: FASTA
      _:
      - "Large (~3hr/job-calibrated) batch of a per-sample ORF FASTA; fans out the\
        \ AMR ORF tools (rgi, amrfinderplus, megares, bacmet, vfdb). Distinct sibling\
        \ of orfs (granularity:batch, NOT a subtype \u2014 like contig_batch to assembly\
        \ and orf_chunk to orfs) so the solver routes AMR-sized batches to the AMR\
        \ ORF tools without entangling them with the W2 annotation orf_chunk path\
        \ (granularity:chunk). Produced in-DAG by splitOrfsForAmr.py (replacing the\
        \ external w4_rebatch.py); headers reversibly sample-prefixed (SG<id>~k141_N_k)\
        \ so w4_recompile.py splits on the first '~' to de-prefix + regroup per sample."
      content: open reading frames
      ext: faa
      granularity: batch
  orf_chunk:
    properties:
      Data: protein sequence
      Format: FASTA
      _:
      - Fixed-size (~5000 ORF) chunk of a per-sample ORF FASTA; fans out CPU/IO-bound
        annotators (distinct sibling of orfs, like forward_short_reads is to short_reads)
      content: open reading frames
      ext: faa
      granularity: chunk
  orfs:
    properties:
      Data: protein sequence
      Format: FASTA
      content: open reading frames
      ext: faa
      granularity: whole
  orfs_shard:
    properties:
      Data: protein sequence
      Format: FASTA
      _:
      - Length-balanced shard of an ORF FASTA; fans out embedding transforms
      content: open reading frames
      ext: faa
      granularity: whole
  pacbio_hifi_bam:
    properties:
      Data: nucleic acid sequence
      Format: BAM
      _:
      - PacBio HiFi reads in BAM format
      ext: bam
      parity: single
      read_length: long
  predicted_structures:
    properties:
      Format: mmCIF
      _:
      - Predicted protein structures keyed by ORF id (tar of mmCIF files)
      ext: tar.gz
  putative_genome:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      ext: fna
      genome_scope: single
  read_metadata:
    properties:
      _:
      - read metadata
      ext: json
      fields:
      - length_class
      - parity
  read_pair:
    properties:
      atomic: a pair of read files
  read_qc_stats:
    properties:
      _:
      - read QC stats
      ext: json
      fields:
      - GC
      - N50
      - bases
      - mean_quality
      - phred_encoding
      - reads
  reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      qc: none
  reverse_ora_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      compression: ora
      direction: reverse
      ext: fastq.ora
      pair_state: half
      parity: paired end
      qc: none
      read_length: short
  reverse_short_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      compression: none
      direction: reverse
      ext: fq
      pair_state: half
      parity: paired end
      qc: none
      read_length: short
  semibin2_bin_fasta:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - a single metagenomic bin FASTA file
      ext: fna
      genome_scope: single
      method: semibin2
  short_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      qc: none
      read_length: short
  short_reads_pe:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      parity: interleaved
      qc: none
      read_length: short
  short_reads_se:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      _:
      - DNA reads
      compression: gzip
      ext: fq.gz
      pair_state: complete
      parity: single
      qc: none
      read_length: short
  structure_3di_tokens:
    properties:
      Format: Parquet
      _:
      - Foldseek 3Di token strings per ORF (sequence_id -> 3di)
      ext: parquet
  unpaired_read_half:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      compression: gzip
      ext: fq.gz
      pair_state: half
      qc: none
  zipped_forward_short_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      compression: gzip
      direction: forward
      ext: fq.gz
      pair_state: half
      parity: paired end
      qc: none
      read_length: short
  zipped_reverse_short_reads:
    properties:
      Data: nucleic acid sequence
      Format: FASTQ
      compression: gzip
      direction: reverse
      ext: fq.gz
      pair_state: half
      parity: paired end
      qc: none
      read_length: short
