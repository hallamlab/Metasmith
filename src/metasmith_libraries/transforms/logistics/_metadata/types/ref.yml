ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  ankh_base_weights:
    properties:
      _:
      - Ankh-base weights (ElnaggarLab/ankh-base)
      ext: tgz
  ankh_large_weights:
    properties:
      _:
      - Ankh-large weights (ElnaggarLab/ankh-large)
      ext: tgz
  antismash:
    properties:
    - for antiSMASH
  boltz2_weights:
    properties:
      _:
      - Boltz-2 weights (boltz-community/boltz-2)
      ext: tgz
  boltz_msa_db:
    properties:
    - ColabFold MSA databases for Boltz-2 (~2 TB; unused stub)
  centrifuger_db:
    properties:
    - Centrifuger FM-index prefix (.1.cfr .. .4.cfr files share a common prefix)
  esm_c_300m_weights:
    properties:
      _:
      - ESM-C 300M weights (EvolutionaryScale/esmc-300m)
      ext: tgz
  esm_c_600m_weights:
    properties:
      _:
      - ESM-C 600M weights (EvolutionaryScale/esmc-600m)
      ext: tgz
  esmfold_weights:
    properties:
      _:
      - ESMFold v1 weights (facebook/esmfold_v1)
      ext: tgz
  ganon2_db:
    properties:
    - ganon2 database prefix (.hibf + .tax files share a common prefix)
  genomad:
    properties:
    - for geNomad
  gtdb:
    properties:
    - genome taxonomy database
  interproscan_data:
    properties:
      _:
      - InterProScan data directory
      ext: tgz
  kofamscan_ko_list:
    properties:
      _:
      - KofamScan KO list file
      ext: tsv
  kofamscan_profiles:
    properties:
      _:
      - KofamScan HMM profile directory containing .hmm files
      ext: tgz
  kraken2_db:
    properties:
    - Kraken2 database directory (hash.k2d + Bracken kmer_distrib)
  metabuli_ref:
    properties:
    - metabuli reference database
  metaphlan_db:
    properties:
    - MetaPhlAn 4 database directory (bowtie2 + .pkl + .nwk)
  phyloflash_db:
    properties:
    - phyloFlash SILVA SSU DB dir (bbmap + UDB + tax tree)
  protein_model_weights:
    properties:
    - Weights bundle for a protein deep-learning model
  prott5_xl_uniref50_weights:
    properties:
      _:
      - ProtT5-XL UniRef50 encoder weights (Rostlab/prot_t5_xl_uniref50)
      ext: tgz
  reference_data:
    properties:
    - reference database
  saprot_650m_weights:
    properties:
      _:
      - SaProt 650M AF2 weights (westlake-repl/SaProt_650M_AF2)
      ext: tgz
  sylph_db:
    properties:
      _:
      - sylph sketch database (single .syldb file)
      ext: syldb
  uniref50_diamond_db:
    properties:
      _:
      - DIAMOND-formatted UniRef50 database
      ext: dmnd
