ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  tool_output:
    properties:
    - What the steps of one build actually wrote, as `<tool>/<version>/` directories
      -- the tool's own output verbatim, the per-record status table saying why anything
      was refused, the derived table, and the manifest and index that make the lot
      re-interpretable rather than merely re-readable. One artifact per producing
      step; a step that ran several tools contributes several directories. Never read
      by a downstream step -- kept so the claims made about it can be checked.
