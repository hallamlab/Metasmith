ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  atom_pairs:
    properties:
      Format: parquet
      _:
      - atom-atom mapping table (AAM), one row per (mnxr, element, substrate atom
        -> product atom) transit. `sub_idx`/`prod_idx` are canonical atom RANKS within
        a metabolite, not names -- decoding a node back to a chemical identity needs
        `metabolite_names`. `pair_w` is the atom-transit count, which is both the
        edge weight and, via the w<=0 drop, the connectivity.
      ext: parquet
      fields:
      - confidence
      - element
      - method
      - mnxr
      - pair_w
      - prod_idx
      - product
      - source
      - sub_idx
      - substrate
  conditions:
    properties:
      Format: parquet
      _:
      - the measurement's condition set -- TERMINALS plus a MASK, one row per condition.
        The terminals name the source (growth substrate) hub, the sink (biomass precursor)
        hubs, the readout hubs and the element; the mask is three (column, values)
        pairs over the GPR table, where `background_*` is what is always in (the host),
        `mask_*` is what this condition adds, and `drop_*` withholds rows the other
        two let through. An overexpression is therefore a host row and a clone row
        both being selected and their conductances summing, and a knockout is a drop;
        the engine takes no perturbation argument and interprets no action column.
        `sink_hub` and `readout_hub` are separate because naming a metabolite a sink
        gives it a PORT to ground instead of a leak, which changes the answer, while
        reading it changes nothing. Per-experiment on purpose; the engine has no default
        set. `ecspr draw` emits its null pool in exactly this schema, which is what
        makes the null arm the same command with a different file.
      ext: parquet
      fields:
      - arm
      - background_column
      - background_values
      - cohort
      - condition_id
      - draw_id
      - drop_column
      - drop_values
      - element
      - is_control
      - mask_column
      - mask_values
      - media
      - n_units
      - readout_hub
      - sink_hub
      - source_hub
      - stratum
  direction_ratios:
    properties:
      Format: parquet
      _:
      - per-reaction DIRECTIONALITY ratios for the directed (diode) solve; MNXR ->
        g_rev/g_fwd = exp(dG'/RT) from the fused direction ensemble. ratio==1.0 is
        reversible (parity with the undirected model); every reaction is present.
      ext: parquet
      fields:
      - dG_prime
      - dir_confidence
      - dir_method
      - dir_tier
      - mnxr
      - ratio
      - sigma
  metabolite_names:
    properties:
      Format: parquet
      _:
      - MNXM -> chemical identity (name, formula, per-element atom counts). REQUIRED
        to decode `atom_pairs` -- that table carries metabolite ids and canonical
        atom ranks, so without this the node keys of the atom-transfer graph have
        no chemical meaning and the conditions' source/sink hubs cannot be resolved
        onto it.
      ext: parquet
      fields:
      - element
      - formula
      - mnxm
      - n_atoms
      - name
  results:
    properties:
      Format: parquet
      _:
      - THE ECSPr measurement -- one row per (condition, probe, orientation, element,
        readout). `readout` is a sink metabolite, any metabolite from the universal
        ground's draw vector, or `total`; a readout whose name starts with `_` is
        a per-condition DIAGNOSTIC (coverage, convergence, the AAM gap, whether the
        condition abstained) carried in the same table so a result cannot be read
        without it. Significance is NOT here -- it is a subtraction and a rank over
        these rows against a null measured in the same schema, which `ecspr score`
        performs -- so a baseline is named at scoring time rather than flagged at
        measurement time.
      ext: parquet
      fields:
      - condition_id
      - element
      - orientation
      - probe
      - readout
      - value
