ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  antismash_db:
    properties:
    - antiSMASH database directory (Pfam, ClusterBlast, MIBiG, Resfams)
  antismash_json:
    properties:
      Format: JSON
      _:
      - antiSMASH JSON results per assembly
      ext: json
  antismash_regions_gbk:
    properties:
      Format: GenBank
      _:
      - antiSMASH GenBank region files (tar)
      ext: tar.gz
  antismash_source:
    properties:
    - Marker for antiSMASH database download
  bakta_db:
    properties:
    - Bakta light database directory
  bakta_gff:
    properties:
      Format: GFF3
      _:
      - Bakta non-coding annotation in GFF3 format (tRNA, rRNA, ncRNA, CRISPR, riboswitches)
      ext: gff3
  bakta_tsv:
    properties:
      Format: TSV
      _:
      - Bakta non-coding annotation summary table
      ext: tsv
  busco_full_table:
    properties:
      Format: TSV
      _:
      - BUSCO full results table with per-sequence marker assignments
      ext: tsv
  busco_lineage:
    properties:
    - Pre-downloaded BUSCO lineage dataset directory
  busco_results:
    properties:
      Format: JSON
      _:
      - BUSCO completeness assessment summary
      ext: json
  busco_source:
    properties:
    - Marker for BUSCO lineage dataset specification
  deepec_predictions:
    properties:
      _:
      - DeepEC EC number predictions
      ext: tsv
  deeptfactor_results:
    properties:
      Format: TSV
      _:
      - DeepTFactor TF predictions (binary TF/non-TF with probability score)
      ext: tsv
  diamond_uniref50_results:
    properties:
      Format: BLAST6
      _:
      - DIAMOND alignment to UniRef50
      ext: tsv
  dram_annotations:
    properties:
      _:
      - DRAM gene annotations (dbCAN/KOfam/Pfam) TSV
      ext: tsv
  dram_db:
    properties:
    - DRAM database directory
  dramv_annotations:
    properties:
      _:
      - DRAM-v gene annotations for viral contigs
      ext: tsv
  dramv_distill:
    properties:
    - DRAM-v distilled AMG summary and visualizations
  eggnog_data:
    properties:
    - eggNOG-mapper database directory
  eggnog_results:
    properties:
      Format: TSV
      _:
      - eggNOG-mapper functional annotations (GO, KEGG, Pfam, COG)
      ext: tsv
  eggnog_source:
    properties:
    - Marker for eggNOG database download
  interproscan_data:
    properties:
    - InterProScan data directory
  interproscan_gff:
    properties:
      Format: GFF3
      _:
      - InterProScan annotations in GFF3 format
      ext: gff3
  interproscan_json:
    properties:
      Format: JSON
      _:
      - InterProScan annotations in JSON format
      ext: json
  interproscan_source:
    properties:
    - Marker for InterProScan data location
  kofamscan_ko_list:
    properties:
      _:
      - KofamScan KO list file
      ext: tsv
  kofamscan_profiles:
    properties:
    - KofamScan HMM profile directory containing .hmm files
  kofamscan_results:
    properties:
      Format: TSV
      _:
      - KEGG KO assignments from KofamScan
      ext: txt
  kofamscan_source:
    properties:
    - Marker for KofamScan database download
  predictf_db:
    properties:
    - PredicTF database directory (deeparg-largerepo + model files)
  predictf_potential:
    properties:
      Format: TSV
      _:
      - PredicTF lower-confidence potential TF predictions
      ext: tsv
  predictf_results:
    properties:
      Format: TSV
      _:
      - PredicTF high-confidence TF predictions with family classification
      ext: tsv
  promotech_predictions:
    properties:
      Format: TSV
      _:
      - PromoTech bacterial promoter predictions per assembly
      ext: tsv
  proteinbert_embeddings:
    properties:
      Format: Parquet
      _:
      - ProteinBERT embedding vectors
      ext: parquet
  proteinbert_index:
    properties:
      Format: CSV
      _:
      - ProteinBERT sequence index
      ext: csv
  uniref50_diamond_db:
    properties:
      _:
      - DIAMOND-formatted UniRef50 database
      ext: dmnd
  uniref50_source:
    properties:
    - Marker for UniRef50 database download
  virsorter2_affi_contigs:
    properties:
      _:
      - VirSorter2 gene affiliation table for DRAM-v
      ext: tab
  virsorter2_boundary:
    properties:
      _:
      - VirSorter2 viral boundary positions
      ext: tsv
  virsorter2_db:
    properties:
    - VirSorter2 reference database directory
  virsorter2_scores:
    properties:
      _:
      - VirSorter2 viral scores and metadata
      ext: tsv
  virsorter2_viral_sequences:
    properties:
      Format: FASTA
      _:
      - VirSorter2 identified viral sequences
      ext: fa
