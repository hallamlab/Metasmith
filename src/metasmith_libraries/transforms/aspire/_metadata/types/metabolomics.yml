ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  jgi_metabolomics_dataset:
    properties:
    - JGI metabolomics dataset directory containing Targeted/ and Untargeted/ subdirectories
  metabolic_model_sbml:
    properties:
      Format: SBML
      _:
      - SBML genome-scale metabolic model file
      ext: xml
  metabolomics_differential:
    properties:
    - Directory containing per-comparison fold-change/p-value/FDR CSV files and volcano
      plots
  metabolomics_fba_results:
    properties:
    - Directory containing per-condition FBA flux CSV and Escher visualization JSON
  metabolomics_feature_table:
    properties:
      Format: CSV
      _:
      - Normalized annotated metabolomics feature matrix (metabolites x samples)
      ext: csv
  metabolomics_pathway_enrichment:
    properties:
    - Directory containing KEGG ORA results CSV and enrichment dot plot
