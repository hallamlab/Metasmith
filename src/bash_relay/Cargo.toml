[package]
name = "msm_relay"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
gethostname = "0.4"
users = "0.11" # for getting $USER
nix = { version = "0.28", features = ["signal", "process"]} # For signaling processes (SIGTERM)
log = "0.4" # Standard logging facade
chrono = "0.4" # timestamps
lazy_static = "1.4" # For thread-safe global access to the log file handle
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scopeguard = "1.2" # for finally block
rand = "0.8"
ctrlc = { version = "3.4", features = ["termination"] } # termination feature for graceful exit
