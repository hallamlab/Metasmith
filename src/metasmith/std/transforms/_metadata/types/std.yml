ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: 0.6.0
types:
  binary_alignment_map:
    properties:
      data: Binary, compressed SAM file
      format: BAM
  hybrid_assembly:
    properties:
      data: Hybrid assembly generated by Pilon
      format: Directory
  long_reads:
    properties:
      data: Long sequence
      format: Sequence file
  long_reads_accession:
    properties:
      data: Accession number associated with long reads
      format: Plaintext file
  long_reads_assembly:
    properties:
      data: Long read assembly generated by Flye
      format: Directory
  long_reads_filtered:
    properties:
      data: Long reads filtered by filtlong
      format: Sequence file
  oci_image_bwa:
    properties:
      data: OCI
      format: Software container
      provides: bwa
  oci_image_fasterq_dump:
    properties:
      data: OCI
      format: Software container
      provides: fasterq_dump
  oci_image_fastqc:
    properties:
      data: OCI
      format: Software container
      provides: fastqc
  oci_image_filtlong:
    properties:
      data: OCI
      format: Software container
      provides: filtlong
  oci_image_flye:
    properties:
      data: OCI
      format: Software container
      provides: flye
  oci_image_longqc:
    properties:
      data: OCI
      format: Software container
      provides: longqc
  oci_image_megahit:
    properties:
      data: OCI
      format: Software container
      provides: megahit
  oci_image_pilon:
    properties:
      data: OCI
      format: Software container
      provides: pilon
  oci_image_samtools:
    properties:
      data: OCI
      format: Software container
      provides: samtools
  oci_image_trimmomatic:
    properties:
      data: OCI
      format: Software container
      provides: trimmomatic
  read_stats:
    properties:
      data: Read statistics
      format: Directory
  sequence_alignment_map:
    properties:
      data: Sequence Alignment/Map file listing read placements
      format: SAM
  short_reads:
    properties:
      data: Short sequence
      format: Sequence file
  short_reads_accession:
    properties:
      data: Accession number associated with short reads
      format: Plaintext file
  short_reads_assembly:
    properties:
      data: Short read assembly generated by MEGAHIT
      format: Directory
  short_reads_filtered:
    properties:
      data: Short reads trimmed by Trimmomatic
      format: Sequence file
