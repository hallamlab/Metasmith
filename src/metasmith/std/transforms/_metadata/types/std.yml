ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: 0.6.0
types:
  assembly:
    properties:
      data: Sequence assembly
  bakta_annotations:
    properties:
      data: BAKTA-annotated genome
      format: Directory
  bakta_database:
    properties:
      data: BAKTA database
      format: Directory
  binary_alignment_map:
    properties:
      data: Binary, compressed SAM file
      format: BAM
  busco_annotations:
    properties:
      data: BUSCO alignment annotations
      format: TSV
  busco_ref:
    properties:
      data: BUSCO reference database
      format: FASTA
  cazy_annotations:
    properties:
      data: CAZY alignment annotations
      format: TSV
  cazy_ref:
    properties:
      data: CAZY reference database
      format: FASTA
  coding_sequences:
    properties:
      data: Amino acid sequences of all CDS
      format: FAA
  functional_annotations:
    properties:
      data: Compiled functional annotations from all sources
      format: Directory
  gene_features:
    properties:
      data: CDS coordinates
      format: GFF3
  hybrid_assembly:
    properties:
      data: Sequence assembly
      format: Directory
      from: Long reads, improved by short reads
  kofamscan_annotations:
    properties:
      data: Kofamscan-annotated genome
      format: TSV
  kofamscan_ko_list:
    properties:
      data: KO list
      format: TSV
  kofamscan_profile:
    properties:
      data: Kofamscan profile database
      format: Directory | .hmm
  long_reads:
    properties:
      data: Long sequence
      format: Sequence file
  long_reads_accession:
    properties:
      data: Accession number associated with long reads
      format: Plaintext file
  long_reads_assembly:
    properties:
      data: Sequence assembly
      format: Directory
      from: Long reads
  long_reads_filtered:
    properties:
      data: Long reads filtered by filtlong
      format: Sequence file
  long_reads_gfa:
    properties:
      data: Miniasm assembly graph
      format: GFA file
  long_reads_miniasm:
    properties:
      format: Sequence file
  long_reads_self_mappings:
    properties:
      data: All-vs-all read self-mappings via minimap2
      format: Sequence file
  oci_image_bakta:
