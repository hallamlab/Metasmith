      provides: bakta
  oci_image_diamond:
    properties:
      data: OCI
      format: Software container
      provides: diamond
  oci_image_fasterq_dump:
    properties:
      data: OCI
      format: Software container
      provides: fasterq_dump
  oci_image_fastqc:
    properties:
      data: OCI
      format: Software container
      provides: fastqc
  oci_image_filtlong:
    properties:
      data: OCI
      format: Software container
      provides: filtlong
  oci_image_flye:
    properties:
      data: OCI
      format: Software container
      provides: flye
  oci_image_kofamscan:
    properties:
      data: OCI
      format: Software container
      provides: kofamscan
  oci_image_longqc:
    properties:
      data: OCI
      format: Software container
      provides: longqc
  oci_image_megahit:
    properties:
      data: OCI
      format: Software container
      provides: megahit
  oci_image_minimap2:
