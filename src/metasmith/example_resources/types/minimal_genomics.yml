ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: '0.6'
types:
  aa_sequences:
    properties:
      data: Amino acid sequence
      format: FASTA
  contigs:
    properties:
      data: DNA sequence
      format: FASTA
  oci_image_blast:
    properties:
      data: software container
      format: OCI
      provides:
      - blast
  oci_image_prodigal:
    properties:
      data: software container
      format: OCI
      provides:
      - prodigal
  orf_annotations:
    properties:
      data: Protein features
      format: CSV
  protein_reference_fasta:
    properties:
      data: database reference
      format: .faa
