ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  bench_cohorts.py:
    properties:
      _:
      - the four benchmark arms, read out of the acquired literature products in one
        schema
      src: bench_cohorts
      usage: library
  bench_edges.py:
    properties:
      _:
      - benchmark entry -> MNXR edge set -- the curated, override, MetaCyc, bridge
        (accession/EC/KO) and literature routes, layered with every agreeing route
        recorded
      src: bench_edges
      usage: library
  bench_evidence_weights.py:
    properties:
      _:
      - the deployed per-protein belief weight -- 1.0 per protein split across lanes,
        then by score, then across fanout
      src: bench_evidence_weights
      usage: library
  bench_universe.py:
    properties:
      _:
      - the benchmark's atom universe -- the bake's mapped reactions less MetaNetX-flagged
        transport, with the count both builders report
      src: bench_universe
      usage: library
  benchmark:
    properties:
      _:
      - the benchmark drivers -- the study tier, the condition table, the two host
        GPR builders and the condition GPR
      src: benchmark
      usage: library
  build_module:
    properties:
      _:
      - python module imported by a build transform's driver; never ships in the wheel
      usage: library
  ecmdb_scrape.py:
    properties:
      _:
      - walks ECMDB's paginated /concentrations browse into one JSON table, values
        normalised to mM, refusing a short snapshot rather than pinning one
      src: ecmdb_scrape
      usage: library
  ecspr:
    properties:
      _:
      - the ecspr package -- `ecspr.bake` is the whole bake method (both lanes, the
        extractor, the encoding, the tool-output ledger), reached as `python3 -m ecspr.bake.<lane>.<module>`
      src: ecspr
      usage: library
  mnx_lookups.py:
    properties:
      _:
      - builds and reads the five lookups -- reactions, metabolites, atom_ranks, xrefs,
        synonyms -- and owns the canonical-rank and formula-count definitions every
        consumer used to re-implement
      src: mnx_lookups
      usage: library
  mnxr_lookup.py:
    properties:
      _:
      - builds ref::mnxr_lookup -- the reaction bridge, from MetaNetX, KEGG and Rhea
      src: mnxr_lookup
      usage: library
  pool:
    properties:
      _:
      - the label-pool drivers -- selection from the bridge, the ESM-C embedding pass,
        and the final index/stack assembly
      src: pool
      usage: library
