# bench:: -- the evaluation set.
#
# Networks are NOT stored. Each x in X is constructed at run time from the
# conditions table plus two GPR tables, which between them carry every edge any
# condition needs: the host GPR supplies the background network, the condition GPR
# supplies the edges each condition adds or deletes. That is why there is no
# base_graphs or universe type here -- storing them would freeze a derivation the
# conditions table already expresses.
#
# The per-host GPR tables reuse ref::gpr_table_{gem,denovo} from the shipped
# library rather than being redeclared here; they are references a run could also
# consume, not benchmark-only artifacts.
types:
  benchmark_artifact:
    properties:
      _: part of the evaluation set

  condition_gpr:
    extends: [benchmark_artifact]
    properties:
      _: >-
        ONE gene->reaction table over every benchmark condition, carrying the edges
        each condition adds or deletes, with the deployed per-protein belief weight
        (each protein carries total belief 1.0 split across the lanes that annotated
        it, then across each nomination's fanout). Cohorts: gof_native, gof_het, lof,
        eydallin.
      ext: parquet

  conditions:
    extends: [benchmark_artifact]
    properties:
      _: >-
        One row per network to build -- host, arm, tier, and which condition_gpr edges
        it applies. This is the table the run-time network construction reads; it is
        what makes X derivable rather than stored.
      ext: tsv

  expectations:
    extends: [benchmark_artifact]
    properties:
      _: >-
        Y -- the expected direction of movement per (condition, edge), with its anchor
        and basis. Already built; carried as a declared input rather than rebuilt.
      ext: tsv

  # -------------------------------------------------
  # The per-STUDY evaluation set. One folder per publication, on one file schema, so a
  # study can be added, revised or withdrawn without touching any other -- which is why
  # the folders are cut this way rather than by processing stage.
  study_extractions:
    extends: [benchmark_artifact]
    properties:
      _: >-
        The human reading of each paper, <study>/extraction.tsv -- one row per claimed
        effect. A GIVEN: there is no transform that turns a PDF supplement into rows,
        and pretending otherwise would dress a judgement call up as a computation. It
        is the PRIMARY artifact; everything else in a study folder is a projection of it.
      Format: DIRECTORY

  study_benchmark:
    extends: [benchmark_artifact]
    properties:
      _: >-
        One folder per study, each holding exactly extraction.tsv, gpr_manual.parquet,
        conditions.tsv and README.md. A folder missing a file is a named failure; a
        folder with an extra one is a schema violation.
      Format: DIRECTORY
