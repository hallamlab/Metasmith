# interm:: -- transient build intermediates.
#
# These have a type so the DAG can express the real method, but they are NOT a
# tier under data/. They live in a metasmith work directory for the length of a
# build and are never pinned. That is the whole reason `raw/direction/` and
# `raw/mnxref-4_5/` were deleted: they were exactly this, sitting in the
# acquisition tier pretending to be sources.
#
# The metabolism trio is baked in one pass from these two, which is what makes
# the bake-identity block coherent across the three output files.
#
# ONE TYPE PER TOOL LANE. The R6 bake used to be two transforms -- one per ensemble --
# each running every one of its members internally, so the graph said "atom mapping
# happens" and nothing more. The lanes below are what makes the ENSEMBLE a fact the
# planner knows: each member is a step with its own environment, its own resources and
# its own product, and a member that did not run is a missing node rather than a column
# that quietly went empty. It is also what lets a driver hand one lane in and skip it --
# the whole reason the split is worth its extra types.
#
# Every lane product is the EXTRACTOR's output, not the mapper's cache. The cache is a
# tool's private format and lands in evidence::; the pairs table is the shared shape
# (mnxr, element, substrate, product, sub_idx, prod_idx, pair_w, ...) the fuse and the
# stack read. Keeping the boundary there means a member is swappable at the type level.
types:
  build_intermediate:
    properties:
      _: transient; produced and consumed within one build, never pinned

  # -- the adjudication, ahead of every lane ----------------------------------
  aam_worklist:
    extends: [build_intermediate]
    properties:
      _: >-
        ONE ROW PER MNXR over the whole reaction universe, each with a closed-set verdict
        and, where the reaction is blocked, the family of each structureless participant.
        Every mapper lane reads its todo list from HERE rather than deriving one from
        `lookup::reactions`, which is what makes "the three members saw the same list" a
        property of the graph instead of three filters that happen to agree. It is also
        the ledger spine: a reaction that produced no pairs and a reaction that was never
        attempted are different rows, and the tier-4 gate reads the verdict to say WHY a
        reaction is missing.
      ext: parquet

  # -- the two twin searches, ahead of the rescue -----------------------------
  # TWO TYPES FOR ONE MODULE, and the split is the point rather than an accident of
  # packaging. `aam.twins` answers one question -- does MNXref already hold a structure
  # for this, under another id -- with two evidence standards, and each standard's yield
  # has to stay a number of its own: one admits a body with no tracked atoms, the other
  # admits real atoms and has to earn it. Merged into one product, a gain in the safe
  # half would cover a loss in the risky half.
  aam_blockers:
    extends: [build_intermediate]
    properties:
      _: >-
        A DIRECTORY: `crosswalk.tsv` (the accepted twins, in the shape the rescue's
        merge takes), `decisions.tsv` (EVERY candidate blocker with a named refusal
        predicate) and `summary.tsv`. Accepts only an ELEMENT-NEUTRAL twin -- zero C, N,
        S and P, all four known from the recount -- which is a coded predicate rather
        than a maintained exclusion list: the acyl-carrier twin carries C14 N3 S1 P1 and
        is refused by it without being named anywhere. `summary.tsv` also carries the
        overlap with `curation.lane_acceptor`, because that lane already reaches six
        spellings of the same claim and what this one ADDS is the number that matters.

  aam_nametwin:
    extends: [build_intermediate]
    properties:
      _: >-
        Same three files, different standard of proof. This one admits a twin with REAL
        atoms, so a shared name is never enough on its own: it wants a shared source
        accession or a balance that closes only after the substitution, and it refuses
        on a differing InChIKey connectivity block. `UDP` the glycan against `UDP` the
        nucleotide is the case it exists to refuse.

  # -- the rescue, between the two mapper passes ------------------------------
  aam_rescue:
    extends: [build_intermediate]
    properties:
      _: >-
        A DIRECTORY, because the rescue is four artifacts that only mean anything
        together: `crosswalk.tsv` (what structure each blocker was given, with the basis
        that warrants it), `placeholders.tsv` (which of those are scaffolding whose atoms
        must be suppressed), `balance.tsv` (the per-(reaction, element) concrete-balance
        verdict, which is pure chemistry and needs no mapper), and `rescued.parquet` (the
        completed reaction SMILES, in the shape a mapper lane reads). Splitting them into
        four types would let a lane be handed one build's crosswalk and another's
        placeholders, and the extractor would suppress the wrong atoms without complaint.

  aam_algebra:
    extends: [build_intermediate]
    properties:
      _: >-
        A DIRECTORY holding TWO GRAINS that must never be joined. `forced_pairs.parquet`
        is atom-grain, in `atom_pairs.PAIR_COLS` shape, and holds only what conservation
        leaves no choice about once a participant standing on both sides with equal
        multiplicity has cancelled -- cancellation on identity, so no formula is
        consulted and nothing is inferred. `claims.tsv` is species-grain: the count
        conservation fixes for a lone unknown, and the generic-carrier class that pairs
        by name. Those settle a number about a MOLECULE and imply no atom
        correspondence, so they are reported and never banked; a structureless species
        has no canonical rank to hang one on in any case. One type, because the pair
        table's honesty depends on the claim table being read beside it.

  aam_partial:
    extends: [build_intermediate]
    properties:
      _: >-
        A DIRECTORY, for the same reason `aam_rescue` is: three artifacts that only mean
        anything together. `partial_universe.parquet` holds the element-reduced
        submissions AND the reduced participant lists -- the extractor must read those
        rather than re-parse the equation, or the strict guard calls every submission
        `stripped`. `partial_forced.parquet` holds the pairs conservation settles without
        any mapper, already in the extractor's shape. `summary.tsv` records what the
        reduction could NOT reach, which is the half a coverage claim is made of.

  # A THIRD MEMBER PASS, over the partial universe. Same three members, same shape as
  # the rescue pass -- what differs is only what they are pointed at, and that is the
  # argument for keeping them separate types rather than one with a mode.
  aam_member_rxnmapper_partial:
    extends: [build_intermediate]
    properties:
      _: RXNMapper over the element-reduced submissions; pairs keyed on (reaction, element)
  aam_member_localmapper_partial:
    extends: [build_intermediate]
    properties:
      _: LocalMapper over the element-reduced submissions; pairs keyed on (reaction, element)
  aam_member_indigo_partial:
    extends: [build_intermediate]
    properties:
      _: Indigo over the element-reduced submissions; pairs keyed on (reaction, element)

  # -- the AAM lanes ----------------------------------------------------------
  # No `aam_layer_metacyc` here, and its absence is a decision. The curated layer was a
  # type for one afternoon, produced by a lane of its own and consumed by the members as
  # their `--exclude` list. That put a node between the licensed drop-in and every member
  # -- nothing could start until the curated extraction finished -- to save mapping that
  # `aam_layers.stack` discards anyway, since it restricts each layer to what nothing
  # below it claimed. The curated read moved into `aam_ensemble`, where its output is
  # consumed in the same step that makes it and needs no type at all.
  aam_member_rxnmapper:
    extends: [build_intermediate]
    properties:
      _: >-
        The RXNMapper member's pairs, extracted with `--align strict`. Strict is
        correct for every L2 member and not for L1: WE build these reaction SMILES
        from the equation, one fragment per participant, so a template-count mismatch
        really does mean a molecule went missing and the mapper re-routed its atoms.
      ext: parquet

  aam_member_localmapper:
    extends: [build_intermediate]
    properties:
      _: >-
        The LocalMapper member's pairs. The long pole of the whole build -- well under
        one reaction per second over what layer 1 left -- which is the practical reason
        this is its own step: a method change anywhere else must not re-pay it.
      ext: parquet

  aam_member_indigo:
    extends: [build_intermediate]
    properties:
      _: >-
        The Indigo member's pairs, merged from its shards. Indigo can hang inside its
        compiled search where no signal and no timeout option reaches it, so the lane
        shards, records what it ATTEMPTED before attempting it, and retries recorded
        timeouts at a longer budget. A hang writes no row; the sidecar is the only
        thing that says it happened.
      ext: parquet

  # -- the AAM lanes, pass 2: the same three members over the RESCUED universe --
  # SIX MEMBER TYPES, NOT THREE WITH TWO PRODUCERS EACH. The planner resolves a
  # requirement to exactly one producer and reports a healthy plan; a second producer is
  # silently dropped, so collapsing the passes would turn a six-member ensemble into a
  # three-member one behind a plan that looks fine. It is also not the same question
  # being asked twice: a rescued reaction has a DIFFERENT SMILES for the same MNXR --
  # curated structures where MetaNetX had none, `*` bodies where the carrier is generic
  # -- so merging the two passes' caches on `mnxr` would overwrite one map with a map of
  # a different molecule.
  #
  # WHY A SECOND PASS AT ALL. In the deployed table every rescue-derived reaction is
  # `mcs_only`: Indigo alone, at half weight, because the crosswalk did not exist when
  # the neural members ran. Showing the completed reactions to all three promotes what
  # they agree on to full-weight consensus, which is the one place this build is meant to
  # BEAT the table it reproduces rather than match it.
  aam_member_rxnmapper_rescue:
    extends: [build_intermediate]
    properties:
      _: RXNMapper over the rescued universe -- the completed reactions pass 1 could not build
      ext: parquet

  aam_member_localmapper_rescue:
    extends: [build_intermediate]
    properties:
      _: LocalMapper over what pass 2's other two members left unmapped or unbalanced -- a gap set, like its pass-1 lane
      ext: parquet

  aam_member_indigo_rescue:
    extends: [build_intermediate]
    properties:
      _: Indigo over the rescued universe -- the deployed chain's only rescue mapper, here one vote of three
      ext: parquet

  # -- the direction lanes ----------------------------------------------------
  direction_member_eq:
    extends: [build_intermediate]
    properties:
      _: >-
        The eQuilibrator member: per-MNXR dG'0 with sigma and an abstention reason,
        from component-contribution over the pinned compound cache. Carries BOTH arms;
        the calibration reads only the measured one, because the group-contribution arm
        returns identically zero for group-conserving chemistry and would manufacture a
        fictitiously tight zero-centred REVERSIBLE bin.
      ext: parquet

  direction_member_dgbyg:
    extends: [build_intermediate]
    properties:
      _: >-
        The dGbyG member: per-MNXR dG'0 from the 100-head GNN ensemble, sigma being a
        genuine per-head spread. ABSTAINS on any reaction carrying an R-group wildcard
        -- rdkit hands `*` a valid feature vector, so the model returns a confident
        number for a compound it never trained on ('*C(=O)O' -> -360 +/- 26). Correlated
        with the eQuilibrator member (both TECRDB-fitted), which is why the combiner
        floors their fused uncertainty rather than counting two votes.
      ext: parquet

  aam_pairs:
    extends: [build_intermediate]
    properties:
      _: >-
        Fused atom-atom correspondences with provenance -- mnxr, element, substrate,
        product, sub_idx, prod_idx, pair_w, method, source, confidence. Three ensemble
        members: RXNMapper + LocalMapper (neural, correlated, mutually discounted) and
        MetaCyc curated (independent, full weight). method is one of consensus /
        <member>_only / disagree_diluted -- a provenance record, never a usability gate.
      ext: parquet

  direction_annotation:
    extends: [build_intermediate]
    properties:
      _: >-
        The fused direction call, keyed by `mnxr` and UNCODED: dG', its sigma, the
        derived forward/reverse ratio, the tier, and which members spoke. What the
        direction ensemble produces before anything is encoded against a vocabulary.
        It crosses a step boundary because the encoding needs a vocabulary the atom
        mapping mints while the science needs nothing from the atom mapping at all --
        merged, a few minutes of encoding held a multi-hour assembly behind a day-long
        branch. Same relationship `aam_pairs` has to `ref::atom_pairs`. Still written
        under the literal name `direction_annotation.parquet` into the producing step's
        evidence, because `check_references.py` finds the string table its equivalence
        check needs by that name.
      ext: parquet
