# buildlib:: -- method code the build transforms import, build side only.
#
# The shipped library already has this shape: `lib::` under
# src/metasmith_libraries/resources/lib/, required by a transform and reached with
# a `sys.path.insert` in its driver (functionalAnnotation/gpr_4lane.py requires
# `lib::fabfos_evidence.py` exactly this way). This is the same pattern on the build
# side, and it exists for the same reason: a driver string is no place for a method.
#
# It stops at a flat file, though, and the bake is where that showed. A method big
# enough to import itself is a PACKAGE, staged as one directory and invoked with
# `-m` -- because flat files that import each other by bare name are only a package
# by accident of landing in the same staged directory, and the price of the accident
# is a requirement list that is a hand-maintained copy of an import graph. So the
# rule this namespace now carries: a method small enough to be one file is one file
# (`mnx_lookups.py`, the four `bench_*.py`); anything larger is a src module,
# vendored (`ecspr`).
#
# Why a SECOND namespace rather than more `lib::` entries. `lib::` ships in the wheel
# (AGENTS.md, "The two libraries") -- it is what a fosmid RUN executes. Nothing here
# runs during a fosmid pipeline; these modules only ever execute while COMPILING a
# reference. Putting them in `lib::` would ship the reaction-universe mappers and the
# thermodynamics ensemble to every user who installs FabFos to assemble fosmids.
#
# The split is the same one build.sh's header describes for data types, applied to
# code: run-side in the submodule, build-only here.
types:
  build_module:
    properties:
      _: python module imported by a build transform's driver; never ships in the wheel
      usage: library

  # -- the shared lookups ------------------------------------------------------
  # Read by every layer of the AAM stack and by the direction lane. This module is what
  # makes the atom node identity ONE artifact instead of five agreeing implementations
  # of `CanonicalRankAtoms`, and one crosswalk loader instead of two with opposite
  # collision policies.
  mnx_lookups.py:
    extends: [build_module]
    properties:
      src: mnx_lookups
      _: builds and reads the five lookups -- reactions, metabolites, atom_ranks, xrefs, synonyms -- and owns the canonical-rank and formula-count definitions every consumer used to re-implement

  # -- the acquisition methods -------------------------------------------------
  # An acquire transform's driver is a shell string, which is the right shape for `wget`
  # and the wrong shape for a paginated HTML scrape. ECMDB publishes its metabolite cards
  # as a file and its CONCENTRATIONS only as a browse, so the acquisition is half download
  # and half scraper, and the scraper is a method.
  ecmdb_scrape.py:
    extends: [build_module]
    properties:
      src: ecmdb_scrape
      _: walks ECMDB's paginated /concentrations browse into one JSON table, values normalised to mM, refusing a short snapshot rather than pinning one

  # -- the bake method ---------------------------------------------------------
  # ONE entry, and it is a directory: the whole ecspr package, vendored out of
  # src/ecspr by build.sh. It used to be twenty-one flat modules with twenty-one
  # declarations, and every transform that needed one named its transitive import
  # closure by hand -- `direction_ensemble` required `aam_shard.py` because
  # `dir_drive.py` imported it at module scope. A missing entry was an ImportError
  # six hours into a queued job, and the list had no way to be checked against the
  # imports it was a copy of.
  #
  # As a directory leaf its instance_id is the tree digest (see
  # models/libraries/identity.py), so the same source tree stages to the same id and
  # a changed one stages to a different id. That is what carries provenance from
  # src/ecspr to a baked table, and it is why the vendored copy is regenerated by
  # the same script that compiles this index rather than by hand.
  ecspr:
    extends: [build_module]
    properties:
      src: ecspr
      _: the ecspr package -- `ecspr.bake` is the whole bake method (both lanes, the extractor, the encoding, the tool-output ledger), reached as `python3 -m ecspr.bake.<lane>.<module>`

  # The reference-label-pool builders: select, embed and assemble, for both the diamond
  # and the ESM-C pool. One directory rather than six declarations, and staged whole so
  # the two pools' variants sit side by side where their divergence is visible.
  pool:
    extends: [build_module]
    properties:
      src: pool
      _: the label-pool drivers -- selection from the bridge, the ESM-C embedding pass, and the final index/stack assembly

  # The MNXR bridge builder. One subject with `mnx_lookups.py` beside it, two programs:
  # that one is the five lookups a bake layer imports, this one is the transform driver
  # that writes the bridge a run reads.
  mnxr_lookup.py:
    extends: [build_module]
    properties:
      src: mnxr_lookup
      _: builds ref::mnxr_lookup -- the reaction bridge, from MetaNetX, KEGG and Rhea

  # -- the benchmark side ------------------------------------------------------
  # The five benchmark drivers, as files rather than as strings inside the transforms
  # that run them. One directory because they are staged together and read the same
  # `bench_*` modules beside them; each is invoked by name with its inputs as argv.
  benchmark:
    extends: [build_module]
    properties:
      src: benchmark
      _: the benchmark drivers -- the study tier, the condition table, the two host GPR builders and the condition GPR
  bench_cohorts.py:
    extends: [build_module]
    properties:
      src: bench_cohorts
      _: the four benchmark arms, read out of the acquired literature products in one schema
  bench_evidence_weights.py:
    extends: [build_module]
    properties:
      src: bench_evidence_weights
      _: the deployed per-protein belief weight -- 1.0 per protein split across lanes, then by score, then across fanout
  # SEVEN routes from an entry to its reactions, not one. The conditions lane reached 203
  # of 845 entries by projecting a gene label through the bridge's accession slice, while
  # the curated reaction ids and LASER's own gene-to-reaction table sat unread beside it.
  # The routes and their layering live here so the transform holds only which givens they
  # read -- the same split every other method module in this namespace makes.
  bench_edges.py:
    extends: [build_module]
    properties:
      src: bench_edges
      _: benchmark entry -> MNXR edge set -- the curated, override, MetaCyc, bridge (accession/EC/KO) and literature routes, layered with every agreeing route recorded
  # ONE definition of what `in_atom_universe` means for a benchmark row. It differs from
  # the bake's coverage by the transport exclusion, and two builders inlining that
  # difference is how three comments came to claim the exclusion while no code did it.
  bench_universe.py:
    extends: [build_module]
    properties:
      src: bench_universe
      _: the benchmark's atom universe -- the bake's mapped reactions less MetaNetX-flagged transport, with the count both builders report

