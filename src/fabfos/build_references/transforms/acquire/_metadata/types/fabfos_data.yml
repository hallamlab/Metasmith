ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  bench_eydallin:
    properties:
    - Eydallin et al. 2010 -- the glycogen-metabolism screen's supplementary table
      and full text (benchmarks/eydallin/).
  bench_keio:
    properties:
    - Baba et al. 2006 (doi:10.1038/msb4100050) -- the Keio single-gene knockout collection's
      supplementary distribution plus the article full text (benchmarks/keio/).
  bench_laser:
    properties:
    - The LASER metabolic-engineering database's upstream repository at a pinned commit
      (benchmarks/laser/). 232 primary papers under one folder -- it is a database
      of publications, not a publication.
  bionumbers:
    properties:
    - 'BioNumbers records for the quantities no metabolomics database measures (bionumbers/<retrieval-date>/):
      `records.json` as the site''s search returned it, plus the individual record
      pages for every BNID the bake actually reads. BioNumbers has no bulk download
      and no API, so a search plus the cited record pages IS the acquisition. UNDER
      THE MEASURED-E.-COLI RULE THIS SUPPLIES EXACTLY ONE COMPOUND, dissolved O2 --
      which is nonetheless the third most common participant in the reaction universe,
      behind only water and the proton. Every other candidate is refused in `sources/bionumbers_rejected.tsv`
      with its reason.'
  chebi:
    properties:
    - 'ChEBI flat files (chebi/rel<N>/): compounds, names and structures as served,
      gzipped. Taken from `archive/rel<N>/flat_files/`, NOT from the rolling `flat_files/`
      path -- the archive is frozen at its own URL, so the release number is a true
      pin rather than a label on whatever is current. Feeds the curation sweep''s
      supplier lane: a name and an accession are the only handles a structureless
      MetaNetX stub has.'
  ecmdb:
    properties:
    - 'ECMDB''s E. coli metabolome distribution (ecmdb/<release>/): `ecmdb.json.zip`
      as served, plus `concentrations.json` -- the paginated /concentrations browse
      walked into one table by `buildlib::ecmdb_scrape.py`. BOTH are needed and neither
      substitutes for the other: the bulk file is 3,760 metabolite cards carrying
      kegg/chebi/hmdb/m2m identifiers and NO concentrations, and the browse is the
      only machine-readable source of the measurements. The scrape is the acquisition,
      not a parse -- there is no API -- which puts it on the same footing as the KEGG
      REST responses saved as the endpoint returned them. The measurements are not
      ECMDB''s own: the citation column names the primary studies by PMID, so this
      is citable as a panel rather than as one database''s opinion.'
  equilibrator:
    properties:
    - 'eQuilibrator compound cache (equilibrator/<package-version>/): compounds.sqlite
      + cc_params.npz, with the Zenodo checksums they are verified against. Pinned
      explicitly so a build is not silently dependent on the package''s first-use
      fetch.'
  esm_c:
    properties:
    - 'The ESM-C 600M HuggingFace snapshot (esm_c/<revision>/), tarred as `esmc_600m.tgz`
      with the repo''s own layout inside -- `data/weights/ esmc_600m_2024_12_v0.pth`
      plus config.json and the README, verbatim. The directory is named after the
      resolved commit sha, read from the server before any bytes move, because `main`
      rolls. GATED: an account that has accepted the model''s terms is the only way
      to fetch it, so the acquisition refuses without a token rather than writing
      the 401 body to disk.'
  ezpred:
    properties:
    - 'EZpred''s two published Zenodo artifacts (ezpred/<release>/): `models.zip`
      (the enzyme / non-enzyme MLP ensembles) and `Data2.zip` (the label IA tables
      predict.py reads). The upstream SOURCE tree is NOT here -- it is code, not data,
      and is vendored in build_references/resources/buildlib/ with its DL-only patch,
      so the originals tier holds only what a URL returns. Zenodo record ids ARE the
      release, which is why they name the directory.'
  genomes:
    properties:
    - Per-host NCBI assembly data (genomes/<host>/genome/) and the published curated
      model where one exists (genomes/<host>/GEM/). The host set is a fact in the
      transform, not a caller's argument.
  kegg:
    properties:
    - KEGG REST bulk link responses (kegg/<release>/), saved as the endpoints returned
      them (ko:K##### <TAB> rn:R#####). No prefix stripping, no header, no join. REST
      serves the live database rather than the numbered release, so the info response
      is kept alongside to date the pull within it.
  kofam:
    properties:
    - 'KOfam distribution (kofam/<build-date>/): profiles.tar.gz, ko_list.gz and README,
      all exactly as served. The tarball is NOT untarred and the list is NOT gunzipped
      -- both are the processed tier''s work. KOfam publishes no release number and
      no checksums, so the directory is named after the gzip header''s MTIME on the
      profiles -- a stamp carried inside the artifact, so it stays re-derivable offline
      from the file it names.'
  metanetx:
    properties:
    - 'MetaNetX/MNXref release tree (metanetx/<version>/): chem_prop, chem_xref, reac_prop,
      reac_xref and their upstream .md5 sidecars. The identity space everything else
      is expressed in.'
  modelseed:
    properties:
    - The ModelSEED biochemistry compound table (modelseed/<commit>/), pinned by the
      git commit that last touched it. ModelSEED publishes no releases and the file
      is served from a branch, so the commit sha IS the version -- and it is a stronger
      pin than a release number, because it names the exact tree.
  rhea:
    properties:
    - 'Rhea release tree (rhea/<release>/), mirroring the FTP layout: tsv/, ctfiles/,
      rhea-release.properties and LICENSE.txt. The release number is read from the
      server, not assumed.'
  swissprot:
    properties:
    - UniProtKB/Swiss-Prot complete sequences (swissprot/<release>/) plus both release
      markers, reldate.txt and RELEASE.metalink. The reviewed half -- the label pool's
      accessions are exactly this set.
  uniref:
    properties:
    - UniRef50 cluster representative sequences (uniref/<release>/), gzipped as served,
      with the RELEASE.metalink that names the release and carries the md5 they are
      verified against.
