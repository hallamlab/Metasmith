ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  condition_gpr:
    properties:
      _:
      - 'ONE gene->reaction table over every benchmark condition, carrying the edges
        each condition adds or deletes, with the deployed per-protein belief weight
        (each protein carries total belief 1.0 split across the lanes that annotated
        it, then across each nomination''s fanout). Cohorts: gof_native, gof_het,
        lof, eydallin.'
      ext: parquet
  conditions:
    properties:
      _:
      - One row per network to build -- host, arm, tier, and which condition_gpr edges
        it applies. This is the table the run-time network construction reads; it
        is what makes X derivable rather than stored.
      ext: tsv
  study_benchmark:
    properties:
      Format: DIRECTORY
      _:
      - One folder per study, each holding exactly extraction.tsv, gpr_manual.parquet,
        conditions.tsv and README.md. A folder missing a file is a named failure;
        a folder with an extra one is a schema violation.
  study_extractions:
    properties:
      Format: DIRECTORY
      _:
      - 'The human reading of each paper, <study>/extraction.tsv -- one row per claimed
        effect. A GIVEN: there is no transform that turns a PDF supplement into rows,
        and pretending otherwise would dress a judgement call up as a computation.
        It is the PRIMARY artifact; everything else in a study folder is a projection
        of it.'
