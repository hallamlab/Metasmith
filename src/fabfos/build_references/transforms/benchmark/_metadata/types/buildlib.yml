ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  aam_combine.py:
    properties:
      _:
      - the AAM combiner -- consensus / single-member credit / disagreement dilution,
        with the neural-neural discount
      src: aam_combine
      usage: library
  aam_curation.py:
    properties:
      _:
      - layer 3 -- eight proposer lanes emitting one six-column record, the body-cancel
        and per-element balance gates, and the admission check that refuses the four
        ways a curated row can be silently wrong
      src: aam_curation
      usage: library
  aam_indigo_member.py:
    properties:
      _:
      - the third, NON-NEURAL ensemble member and the curation arbiter -- Indigo automap,
        sharded, with the sidecar that makes an uninterruptible compiled hang cost
        one reaction instead of the run
      src: aam_indigo_member
      usage: library
  aam_layers.py:
    properties:
      _:
      - the additive layer stack and its four refusing gates -- a layer may only ADD
        what nothing below it claimed, and "additive" is checked rather than asserted
      src: aam_layers
      usage: library
  aam_metacyc_member.py:
    properties:
      _:
      - the curated (independent) AAM member -- MetaCyc atom-mappings-smiles.dat joined
        to MNXR through reac_xref
      src: aam_metacyc_member
      usage: library
  aam_neural_members.py:
    properties:
      _:
      - the two correlated AAM members -- reaction SMILES built from reac_prop+chem_prop,
        mapped by RXNMapper and LocalMapper, resumable
      src: aam_neural_members
      usage: library
  aam_shard.py:
    properties:
      _:
      - the crc32 partition and the attempted-ids sidecar, shared by the Indigo and
        neural lanes -- the id is flushed BEFORE the attempt, and the sidecar's shard-spec
        header refuses a resume across a different shard count
      src: aam_shard
      usage: library
  aam_worklist.py:
    properties:
      _:
      - adjudicates the whole reaction universe before any mapper runs -- one closed-set
        verdict and one blocker family per reaction, so a reaction that produced nothing
        is distinguishable from one that was never attempted
      src: aam_worklist
      usage: library
  bake_metabolism.py:
    properties:
      _:
      - encode the two intermediates into the three compiled tables under one bake
        identity, with the row-by-row round-trip selftest
      src: bake_metabolism
      usage: library
  bench_cohorts.py:
    properties:
      _:
      - the four benchmark arms, read out of the acquired literature products in one
        schema
      src: bench_cohorts
      usage: library
  bench_edges.py:
    properties:
      _:
      - benchmark entry -> MNXR edge set -- the curated, override, MetaCyc, bridge
        (accession/EC/KO) and literature routes, layered with every agreeing route
        recorded
      src: bench_edges
      usage: library
  bench_evidence_weights.py:
    properties:
      _:
      - the deployed per-protein belief weight -- 1.0 per protein split across lanes,
        then by score, then across fanout
      src: bench_evidence_weights
      usage: library
  bench_universe.py:
    properties:
      _:
      - the benchmark's atom universe -- the bake's mapped reactions less MetaNetX-flagged
        transport, with the count both builders report
      src: bench_universe
      usage: library
  build_evidence.py:
    properties:
      _:
      - keeps each tool's raw output at data/processed/<tool>/<version>/ with the
        manifest and index that make it re-interpretable -- the originals/ shape,
        one layer down
      src: build_evidence
      usage: library
  build_module:
    properties:
      _:
      - python module imported by a build transform's driver; never ships in the wheel
      usage: library
  dir_calibrate.py:
    properties:
      _:
      - category -> dG' calibration on the eQuilibrator measured arm only
      src: dir_calibrate
      usage: library
  dir_canon.py:
    properties:
      _:
      - the direction ensemble's frozen constants (RT, TAU_SHARED, SIGMA_0, the clamp)
        -- the build-side mirror of src/fabfos/canon.py's DIR_*
      src: dir_canon
      usage: library
  dir_combine.py:
    properties:
      _:
      - the direction combiner -- correlated thermo vote, independent curated prior,
        shrink-to-reversible
      src: dir_combine
      usage: library
  dir_curated.py:
    properties:
      _:
      - the curated member -- REACTION-DIRECTION re-expressed in MNXR orientation
        by compound-set comparison
      src: dir_curated
      usage: library
  dir_drive.py:
    properties:
      _:
      - the lane's two driver steps -- build the reaction universe, evaluate one thermo
        member. A module rather than a string inside the transform, so run_r6.sh and
        the transform run the SAME code
      src: dir_drive
      usage: library
  dir_metacyc_flatfile.py:
    properties:
      _:
      - reader for MetaCyc's reactions.dat attribute-value flat file (REACTION-DIRECTION,
        LEFT, RIGHT)
      src: dir_metacyc_flatfile
      usage: library
  dir_refdata.py:
    properties:
      _:
      - MetaNetX loaders for the direction ensemble -- MNXR sides/stoichiometry, MNXM
        properties, and the metacyc crosswalks
      src: dir_refdata
      usage: library
  dir_thermo_dgbyg.py:
    properties:
      _:
      - the dGbyG member -- learned-GNN dGr'0 routed by SMILES, abstaining on any
        R-group wildcard
      src: dir_thermo_dgbyg
      usage: library
  dir_thermo_eq.py:
    properties:
      _:
      - the eQuilibrator member -- component-contribution dGr'0 routed by InChIKey,
        with the uninformative-sigma ceiling
      src: dir_thermo_eq
      usage: library
  ecspr_atom_pairs.py:
    properties:
      _:
      - equation parsing, per-metabolite canonicalisation, and pairs_from_mapped --
        the one identity bookkeeper every AAM member runs through
      src: ecspr_atom_pairs
      usage: library
  mnx_lookups.py:
    properties:
      _:
      - builds and reads the five lookups -- reactions, metabolites, atom_ranks, xrefs,
        synonyms -- and owns the canonical-rank and formula-count definitions every
        consumer used to re-implement
      src: mnx_lookups
      usage: library
  refs_encoding.py:
    properties:
      _:
      - node packing, the vocabulary, and the bake-identity block -- one module so
        the bake and the gate cannot disagree about the encoding
      src: refs_encoding
      usage: library
