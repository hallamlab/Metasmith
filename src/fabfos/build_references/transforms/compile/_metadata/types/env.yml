ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  diamond.env:
    properties:
      _:
      - generic tool environment (container and/or conda); see resources/env/*.env
      provides:
      - diamond
      - diamond/blastp
      - diamond/linclust
      - diamond/makedb
  env:
    properties:
    - generic tool environment (container and/or conda); see resources/env/*.env
  esmc.env:
    properties:
      _:
      - generic tool environment (container and/or conda); see resources/env/*.env
      provides: esmc_embed
  proteinbert.env:
    properties:
      _:
      - generic tool environment (container and/or conda); see resources/env/*.env
      provides: proteinbert
  python_for_data_science.env:
    properties:
      _:
      - generic tool environment (container and/or conda); see resources/env/*.env
      provides:
      - py/biopython
      - py/matplotlib
      - py/numba
      - py/numpy
      - py/pandas
      - py/plotly
      - py/requests
      - py/scipy
      - py/xmltodict
      - python=3.12
  rdkit.env:
    properties:
      _:
      - generic tool environment (container and/or conda); see resources/env/*.env
      provides:
      - localmapper
      - rdkit
      - rxnmapper
