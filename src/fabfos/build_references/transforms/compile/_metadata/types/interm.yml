ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  aam_algebra:
    properties:
    - 'A DIRECTORY holding TWO GRAINS that must never be joined. `forced_pairs.parquet`
      is atom-grain, in `atom_pairs.PAIR_COLS` shape, and holds only what conservation
      leaves no choice about once a participant standing on both sides with equal
      multiplicity has cancelled -- cancellation on identity, so no formula is consulted
      and nothing is inferred. `claims.tsv` is species-grain: the count conservation
      fixes for a lone unknown, and the generic-carrier class that pairs by name.
      Those settle a number about a MOLECULE and imply no atom correspondence, so
      they are reported and never banked; a structureless species has no canonical
      rank to hang one on in any case. One type, because the pair table''s honesty
      depends on the claim table being read beside it.'
  aam_blockers:
    properties:
    - 'A DIRECTORY: `crosswalk.tsv` (the accepted twins, in the shape the rescue''s
      merge takes), `decisions.tsv` (EVERY candidate blocker with a named refusal
      predicate) and `summary.tsv`. Accepts only an ELEMENT-NEUTRAL twin -- zero C,
      N, S and P, all four known from the recount -- which is a coded predicate rather
      than a maintained exclusion list: the acyl-carrier twin carries C14 N3 S1 P1
      and is refused by it without being named anywhere. `summary.tsv` also carries
      the overlap with `curation.lane_acceptor`, because that lane already reaches
      six spellings of the same claim and what this one ADDS is the number that matters.'
  aam_member_indigo:
    properties:
      _:
      - The Indigo member's pairs, merged from its shards. Indigo can hang inside
        its compiled search where no signal and no timeout option reaches it, so the
        lane shards, records what it ATTEMPTED before attempting it, and retries recorded
        timeouts at a longer budget. A hang writes no row; the sidecar is the only
        thing that says it happened.
      ext: parquet
  aam_member_indigo_partial:
    properties:
    - Indigo over the element-reduced submissions; pairs keyed on (reaction, element)
  aam_member_indigo_rescue:
    properties:
      _:
      - Indigo over the rescued universe -- the deployed chain's only rescue mapper,
        here one vote of three
      ext: parquet
  aam_member_localmapper:
    properties:
      _:
      - 'The LocalMapper member''s pairs. The long pole of the whole build -- well
        under one reaction per second over what layer 1 left -- which is the practical
        reason this is its own step: a method change anywhere else must not re-pay
        it.'
      ext: parquet
  aam_member_localmapper_partial:
    properties:
    - LocalMapper over the element-reduced submissions; pairs keyed on (reaction,
      element)
  aam_member_localmapper_rescue:
    properties:
      _:
      - LocalMapper over what pass 2's other two members left unmapped or unbalanced
        -- a gap set, like its pass-1 lane
      ext: parquet
  aam_member_rxnmapper:
    properties:
      _:
      - 'The RXNMapper member''s pairs, extracted with `--align strict`. Strict is
        correct for every L2 member and not for L1: WE build these reaction SMILES
        from the equation, one fragment per participant, so a template-count mismatch
        really does mean a molecule went missing and the mapper re-routed its atoms.'
      ext: parquet
  aam_member_rxnmapper_partial:
    properties:
    - RXNMapper over the element-reduced submissions; pairs keyed on (reaction, element)
  aam_member_rxnmapper_rescue:
    properties:
      _:
      - RXNMapper over the rescued universe -- the completed reactions pass 1 could
        not build
      ext: parquet
  aam_nametwin:
    properties:
    - 'Same three files, different standard of proof. This one admits a twin with
      REAL atoms, so a shared name is never enough on its own: it wants a shared source
      accession or a balance that closes only after the substitution, and it refuses
      on a differing InChIKey connectivity block. `UDP` the glycan against `UDP` the
      nucleotide is the case it exists to refuse.'
  aam_pairs:
    properties:
      _:
      - 'Fused atom-atom correspondences with provenance -- mnxr, element, substrate,
        product, sub_idx, prod_idx, pair_w, method, source, confidence. Three ensemble
        members: RXNMapper + LocalMapper (neural, correlated, mutually discounted)
        and MetaCyc curated (independent, full weight). method is one of consensus
        / <member>_only / disagree_diluted -- a provenance record, never a usability
        gate.'
      ext: parquet
  aam_partial:
    properties:
    - 'A DIRECTORY, for the same reason `aam_rescue` is: three artifacts that only
      mean anything together. `partial_universe.parquet` holds the element-reduced
      submissions AND the reduced participant lists -- the extractor must read those
      rather than re-parse the equation, or the strict guard calls every submission
      `stripped`. `partial_forced.parquet` holds the pairs conservation settles without
      any mapper, already in the extractor''s shape. `summary.tsv` records what the
      reduction could NOT reach, which is the half a coverage claim is made of.'
  aam_rescue:
    properties:
    - 'A DIRECTORY, because the rescue is four artifacts that only mean anything together:
      `crosswalk.tsv` (what structure each blocker was given, with the basis that
      warrants it), `placeholders.tsv` (which of those are scaffolding whose atoms
      must be suppressed), `balance.tsv` (the per-(reaction, element) concrete-balance
      verdict, which is pure chemistry and needs no mapper), and `rescued.parquet`
      (the completed reaction SMILES, in the shape a mapper lane reads). Splitting
      them into four types would let a lane be handed one build''s crosswalk and another''s
      placeholders, and the extractor would suppress the wrong atoms without complaint.'
  aam_worklist:
    properties:
      _:
      - 'ONE ROW PER MNXR over the whole reaction universe, each with a closed-set
        verdict and, where the reaction is blocked, the family of each structureless
        participant. Every mapper lane reads its todo list from HERE rather than deriving
        one from `lookup::reactions`, which is what makes "the three members saw the
        same list" a property of the graph instead of three filters that happen to
        agree. It is also the ledger spine: a reaction that produced no pairs and
        a reaction that was never attempted are different rows, and the tier-4 gate
        reads the verdict to say WHY a reaction is missing.'
      ext: parquet
  build_intermediate:
    properties:
    - transient; produced and consumed within one build, never pinned
  direction_annotation:
    properties:
      _:
      - 'The fused direction call, keyed by `mnxr` and UNCODED: dG'', its sigma, the
        derived forward/reverse ratio, the tier, and which members spoke. What the
        direction ensemble produces before anything is encoded against a vocabulary.
        It crosses a step boundary because the encoding needs a vocabulary the atom
        mapping mints while the science needs nothing from the atom mapping at all
        -- merged, a few minutes of encoding held a multi-hour assembly behind a day-long
        branch. Same relationship `aam_pairs` has to `ref::atom_pairs`. Still written
        under the literal name `direction_annotation.parquet` into the producing step''s
        evidence, because `check_references.py` finds the string table its equivalence
        check needs by that name.'
      ext: parquet
  direction_member_dgbyg:
    properties:
      _:
      - 'The dGbyG member: per-MNXR dG''0 from the 100-head GNN ensemble, sigma being
        a genuine per-head spread. ABSTAINS on any reaction carrying an R-group wildcard
        -- rdkit hands `*` a valid feature vector, so the model returns a confident
        number for a compound it never trained on (''*C(=O)O'' -> -360 +/- 26). Correlated
        with the eQuilibrator member (both TECRDB-fitted), which is why the combiner
        floors their fused uncertainty rather than counting two votes.'
      ext: parquet
  direction_member_eq:
    properties:
      _:
      - 'The eQuilibrator member: per-MNXR dG''0 with sigma and an abstention reason,
        from component-contribution over the pinned compound cache. Carries BOTH arms;
        the calibration reads only the measured one, because the group-contribution
        arm returns identically zero for group-conserving chemistry and would manufacture
        a fictitiously tight zero-centred REVERSIBLE bin.'
      ext: parquet
