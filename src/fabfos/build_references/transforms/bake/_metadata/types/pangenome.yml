ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  all_vs_all_blast:
    properties:
      Data: pooled all-vs-all diamond blastp (blast6, genome-tagged ids)
      ext: tsv
  bsr_histogram:
    properties:
      Data: histogram of cross-genome BLAST score ratio distances
      ext: svg
  heatmap:
    properties:
      Data: pangenome matrix
      ext: svg
  pangenome:
    properties:
      logistics: to group genomes into a pangenome
  ppanggolin_matrix:
    properties:
      Data: ppanggolin matrix
      ext: csv
  ppanggolin_raw:
    properties:
      Data: raw ppanggolin outputs
      ext: ppanggolin
