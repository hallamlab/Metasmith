ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  analysis_asv_meta:
    properties:
      _:
      - the ASV metadata table every downstream analysis reads, corrected or not
      ext: tsv
  analysis_counts:
    properties:
      _:
      - the ASV count matrix every downstream analysis reads, corrected or not
      ext: tsv
  analysis_metadata:
    properties:
      _:
      - the metadata table every downstream analysis reads, augmented or not
      ext: tsv
  asv_clr_after:
    properties:
      _:
      - CLR-transformed counts after ConQuR correction
      ext: tsv
  asv_clr_selected:
    properties:
      _:
      - CLR-transformed counts for the selected feature set
      ext: tsv
  asv_corrected_counts:
    properties:
      _:
      - ConQuR-corrected relative abundances
      ext: tsv
  asv_corrected_counts_int:
    properties:
      _:
      - ConQuR-corrected counts with a pseudocount, integer-valued
      ext: tsv
  asv_filtered_counts:
    properties:
      _:
      - ASV count matrix after prevalence and depth filtering
      ext: tsv
  asv_filtered_seqs:
    properties:
      _:
      - ASV representative sequences surviving table filtering
      ext: fasta.gz
  asv_final_micro:
    properties:
      _:
      - analysis-ready microbial ASV count matrix
      ext: tsv
  asv_final_mito:
    properties:
      _:
      - analysis-ready mitochondrial ASV count matrix
      ext: tsv
  asv_mag_link_off:
    properties:
    - aspire-policy-asv-mag-link
    - aspire-policy-asv-mag-link-off
  asv_mag_link_on:
    properties:
    - aspire-policy-asv-mag-link
    - aspire-policy-asv-mag-link-on
  asv_mag_link_policy:
    properties:
    - aspire-policy-asv-mag-link
  asv_mag_network_outputs:
    properties:
      Data: directory
      _:
      - MAG-annotated co-occurrence network renderings
  asv_mag_outputs:
    properties:
      Data: directory
      _:
      - ASV to MAG linking results
  asv_mag_pairing:
    properties:
      _:
      - ASV to MAG pairing table
      ext: tsv
  asv_meta_micro:
    properties:
      _:
      - long-form ASV table joined to metadata and taxonomy, microbial
      ext: tsv
  asv_meta_mito:
    properties:
      _:
      - long-form ASV table joined to metadata and taxonomy, mitochondrial
      ext: tsv
  asv_selected_counts:
    properties:
      _:
      - relative abundances for the selected feature set
      ext: tsv
  augmentation_audit:
    properties:
      _:
      - record of which metadata rows the soft labels changed
      ext: tsv
  augmentation_off:
    properties:
    - aspire-policy-augmentation
    - aspire-policy-augmentation-off
  augmentation_on:
    properties:
    - aspire-policy-augmentation
    - aspire-policy-augmentation-on
  augmentation_policy:
    properties:
    - aspire-policy-augmentation
  batch_correction_off:
    properties:
    - aspire-policy-batch-correction
    - aspire-policy-batch-correction-off
  batch_correction_on:
    properties:
    - aspire-policy-batch-correction
    - aspire-policy-batch-correction-on
  batch_correction_policy:
    properties:
    - aspire-policy-batch-correction
  bubble_plots:
    properties:
      Data: directory
      _:
      - taxonomic bubble plot renderings
  centroids_fasta:
    properties:
      _:
      - UNOISE denoised centroids
      ext: fasta.gz
  clustermap_outputs:
    properties:
      Data: directory
      _:
      - abundance clustermap renderings
  collectors_outputs:
    properties:
      Data: directory
      _:
      - collector's curve renderings
  concat_counts_fasta:
    properties:
      _:
      - all samples' filtered reads concatenated with sample-relabelled headers, for
        counting
      ext: fasta.gz
  concat_fasta:
    properties:
      _:
      - all samples' filtered reads concatenated, for dereplication
      ext: fasta.gz
  concat_stats:
    properties:
      _:
      - per-sample read counts entering the concatenated pool
      ext: tsv
  contaminant_blast6:
    properties:
      _:
      - ASV hits against the contaminant database
      ext: tsv
  contaminant_blast_db:
    properties:
      Data: directory
      _:
      - BLAST database built from the contaminant reference
  contaminant_reference_source:
    properties:
      _:
      - contaminant/biofilm reference sequences for the contaminant BLAST database
      ext: fasta
  correction_countspace_metrics:
    properties:
      _:
      - count-space preservation metrics for the correction
      ext: tsv
  correction_countspace_plot:
    properties:
      _:
      - count-space preservation check for the correction
      ext: png
  correction_decision:
    properties:
      _:
      - per-feature record of whether correction was applied
      ext: tsv
  correction_stats:
    properties:
      _:
      - batch correction summary statistics
      ext: tsv
  correction_umap_plot:
    properties:
      _:
      - UMAP before and after correction
      ext: png
  counts_decon:
    properties:
      _:
      - ASV counts with contaminant ASVs removed
      ext: tsv
  counts_filtered:
    properties:
      _:
      - ASV counts after non-target removal
      ext: tsv
  counts_micro:
    properties:
      _:
      - ASV counts restricted to microbial ASVs
      ext: tsv
  counts_mito:
    properties:
      _:
      - ASV counts restricted to mitochondrial ASVs
      ext: tsv
  derep_fasta:
    properties:
      _:
      - dereplicated full-length sequences
      ext: fasta.gz
  diversity_outputs:
    properties:
      Data: directory
      _:
      - alpha and beta diversity results and renderings
  external_graph_all:
    properties:
      _:
      - pre-computed unthresholded co-occurrence graph, supplied instead of running
        SpiecEasi
      ext: graphml
  external_graph_thr:
    properties:
      _:
      - pre-computed thresholded co-occurrence graph, supplied instead of running
        SpiecEasi
      ext: graphml
  external_node_features:
    properties:
      _:
      - pre-computed network node features, supplied instead of running SpiecEasi
      ext: csv
  fastp_report_html:
    properties:
      _:
      - fastp QC report rendering for one sample
      ext: html
  fastp_report_json:
    properties:
      _:
      - fastp QC report for one sample
      ext: json
  fastp_stats:
    properties:
      _:
      - per-sample post-fastp read counts
      ext: tsv
  fastq_stats:
    properties:
      _:
      - per-sample raw read counts
      ext: tsv
  filtered_fasta:
    properties:
      _:
      - quality-filtered merged reads for one sample
      ext: fasta.gz
  filtered_stats:
    properties:
      _:
      - per-sample post-filter read counts
      ext: tsv
  graph_network_off:
    properties:
    - aspire-policy-graph-network
    - aspire-policy-graph-network-off
  graph_network_on:
    properties:
    - aspire-policy-graph-network
    - aspire-policy-graph-network-on
  graph_network_policy:
    properties:
    - aspire-policy-graph-network
  grouping_diagnostics_outputs:
    properties:
      Data: directory
      _:
      - group separability diagnostics and their renderings
  indicspecies_aligned_plots:
    properties:
      Data: directory
      _:
      - indicator species renderings aligned across contrasts
  indicspecies_group1_results:
    properties:
      _:
      - full indicator species results for the primary grouping
      ext: tsv
  indicspecies_group1_summary:
    properties:
      _:
      - indicator species summary for the primary grouping
      ext: tsv
  indicspecies_group2_results:
    properties:
      _:
      - full indicator species results for the secondary grouping
      ext: tsv
  indicspecies_group2_summary:
    properties:
      _:
      - indicator species summary for the secondary grouping
      ext: tsv
  indicspecies_off:
    properties:
    - aspire-policy-indicspecies
    - aspire-policy-indicspecies-off
  indicspecies_on:
    properties:
    - aspire-policy-indicspecies
    - aspire-policy-indicspecies-on
  indicspecies_plots:
    properties:
      Data: directory
      _:
      - indicator species renderings
  indicspecies_policy:
    properties:
    - aspire-policy-indicspecies
  indicspecies_tables:
    properties:
      Data: directory
      _:
      - every per-contrast indicator species table
  master_column_collisions:
    properties:
      _:
      - columns that collided during the master merge
      ext: tsv
  master_column_mapping:
    properties:
      _:
      - original to canonical column name mapping
      ext: tsv
  master_count_wide:
    properties:
      _:
      - wide-form master count table
      ext: tsv
  master_long:
    properties:
      _:
      - long-form master ASV table
      ext: tsv
  master_source_manifest:
    properties:
      _:
      - which stage contributed each master table column
      ext: tsv
  measurement_association_outputs:
    properties:
      Data: directory
      _:
      - ASV to continuous-measurement association results
  merged_reads:
    properties:
      _:
      - vsearch-merged read pair for one sample
      ext: fastq.gz
  metadata_micro:
    properties:
      _:
      - study metadata joined to microbial read accounting
      ext: tsv
  metadata_mito:
    properties:
      _:
      - study metadata joined to mitochondrial read accounting
      ext: tsv
  mito_blast6:
    properties:
      _:
      - ASV hits against the mitochondrial database
      ext: tsv
  mito_blast_db:
    properties:
      Data: directory
      _:
      - BLAST database built from the mitochondrial reference
  mito_plots:
    properties:
      Data: directory
      _:
      - renderings of the non-target call
  mito_reference_source:
    properties:
      _:
      - mitochondrial reference sequences for the mito BLAST database
      ext: fasta
  mito_summary_tables:
    properties:
      Data: directory
      _:
      - per-category summaries of the non-target call
  mitomaster_table:
    properties:
      _:
      - MitoMaster classification of each ASV
      ext: tsv
  module_asv_anchor_table:
    properties:
      _:
      - per-ASV module anchor assignments
      ext: tsv
  module_mag_anchor_summary:
    properties:
      _:
      - per-module MAG anchor summary
      ext: tsv
  network_graph_all:
    properties:
      _:
      - unthresholded positive co-occurrence graph
      ext: graphml
  network_graph_thr:
    properties:
      _:
      - thresholded positive co-occurrence graph
      ext: graphml
  network_modules_all:
    properties:
      _:
      - module assignment over the unthresholded graph
      ext: tsv
  network_modules_off:
    properties:
    - aspire-policy-network-modules
    - aspire-policy-network-modules-off
  network_modules_on:
    properties:
    - aspire-policy-network-modules
    - aspire-policy-network-modules-on
  network_modules_policy:
    properties:
    - aspire-policy-network-modules
  network_modules_runs:
    properties:
      _:
      - per-run record of the module detection sweep
      ext: tsv
  network_modules_sub:
    properties:
      _:
      - module assignment over the thresholded graph
      ext: tsv
  network_modules_summary:
    properties:
      _:
      - per-module summary statistics
      ext: tsv
  network_node_features:
    properties:
      _:
      - per-node features of the co-occurrence graph
      ext: csv
  network_outputs:
    properties:
      Data: directory
      _:
      - co-occurrence network renderings and overlays
  nochimera_fasta:
    properties:
      _:
      - chimera-filtered centroids
      ext: fasta.gz
  nontarget_table:
    properties:
      _:
      - master table of ASVs judged non-target (mitochondrial or contaminant)
      ext: tsv
  optional_outputs:
    properties:
      Data: directory
      _:
      - the master summary's optional-contributor slot; the .nf always passes it empty
  outlier_outputs:
    properties:
      Data: directory
      _:
      - sample outlier diagnostics
  paired_group_contrast_outputs:
    properties:
      Data: directory
      _:
      - paired within-subject group contrast results
  power_analysis_outputs:
    properties:
      Data: directory
      _:
      - group contrast statistical power analysis
  qc_reads_fwd:
    properties:
      _:
      - fastp-trimmed forward reads for one sample
      ext: fastq.gz
  qc_reads_rev:
    properties:
      _:
      - fastp-trimmed reverse reads for one sample
      ext: fastq.gz
  run:
    properties:
      _:
      - one ASPIRE study; the grouping parent every stage descends from
      ext: txt
  sample_id:
    properties:
      _:
      - label for one sequenced sample within an ASPIRE run
      ext: txt
  sample_metadata:
    properties:
      _:
      - study metadata table, one row per sample
      ext: tsv
  sample_module_heatmaps:
    properties:
      Data: directory
      _:
      - sample by module score heatmap renderings
  sample_module_matrix:
    properties:
      _:
      - sample by module score matrix
      ext: tsv
  sample_module_scores:
    properties:
      _:
      - per-sample module activity scores
      ext: tsv
  sample_top_modules:
    properties:
      _:
      - the highest scoring module per sample
      ext: tsv
  sankey_off:
    properties:
    - aspire-policy-sankey
    - aspire-policy-sankey-off
  sankey_on:
    properties:
    - aspire-policy-sankey
    - aspire-policy-sankey-on
  sankey_outputs:
    properties:
      Data: directory
      _:
      - read-fate sankey renderings
  sankey_policy:
    properties:
    - aspire-policy-sankey
  silva_ref_taxonomy:
    properties:
      _:
      - SILVA reference taxonomy map for taxonomy assignment
      ext: tsv
  sina_aligned_seqs:
    properties:
      _:
      - raw SINA alignment of the ASV sequences
      ext: fasta.gz
  sina_arb_reference:
    properties:
      _:
      - SILVA ARB reference SINA aligns against
      ext: arb
  sina_log:
    properties:
      _:
      - SINA alignment log
      ext: log
  sina_trimmed_seqs:
    properties:
      _:
      - SINA-aligned ASV sequences trimmed to the target variable regions
      ext: fasta.gz
  sina_v_regions:
    properties:
      _:
      - per-sequence variable region assignments parsed from the SINA log
      ext: tsv
  soft_assignments:
    properties:
      _:
      - soft group-label assignments for samples missing a hard label
      ext: tsv
  soft_validation:
    properties:
      _:
      - per-sample validation of the soft label assignment
      ext: tsv
  soft_validation_summary:
    properties:
      _:
      - summary of soft label assignment quality
      ext: tsv
  spieceasi_off:
    properties:
    - aspire-policy-spieceasi
    - aspire-policy-spieceasi-off
  spieceasi_on:
    properties:
    - aspire-policy-spieceasi
    - aspire-policy-spieceasi-on
  spieceasi_policy:
    properties:
    - aspire-policy-spieceasi
  stage_asv_meta:
    properties:
      _:
      - the ASV metadata table after label augmentation and before batch correction
      ext: tsv
  taxonomy_group_association_outputs:
    properties:
      Data: directory
      _:
      - subject-aware taxonomy to group association results
  taxonomy_stats:
    properties:
      _:
      - taxonomy assignment summary statistics
      ext: tsv
  taxonomy_uppercase_seqs:
    properties:
      _:
      - ASV sequences uppercased for taxonomy assignment
      ext: fasta.gz
  umap_hdbscan_results:
    properties:
      _:
      - UMAP embedding with HDBSCAN cluster assignments
      ext: tsv
  umap_plots:
    properties:
      Data: directory
      _:
      - UMAP clustering renderings
  upset_plots:
    properties:
      Data: directory
      _:
      - UpSet renderings of metadata group overlap
  voc_correlation_outputs:
    properties:
      Data: directory
      _:
      - ASV to volatile-compound correlation results
