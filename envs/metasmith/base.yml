channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12
  - nextflow=26.04.1
  - graphviz=13.1.1 # `neato -n2` rasterizes raster DAG formats; layout is ours
  - pyyaml=6.0.2
  - numpy=2.2.5
  - rsync=3.4.1
  - pigz=2.8
  - unzip=6.0
  - git=2.52.0 # tutorials and user libraries; the standard library ships in the package

  # The standard library ships INSIDE this package, vendored to
  # `metasmith/vendor/` by `dev/metasmith.sh --vendor-library`, so there is no
  # dependency to declare here. It used to be a separate conda package named on
  # this line, which meant conda's solve was the only thing that could deliver
  # it -- a wheel, a `pip install` and the relay-free runtimes got no library at
  # all. It also made the library a second versioned artifact inside a monorepo
  # whose whole point is that a library change and its consumer land in one
  # commit.
  - tk=8.6.13 # for globus

  # # relay now just uses files
  # # networking (mostly for relay)
  # - python-socketio=5.14.2
  # - python-engineio=4.12.3
  # - websocket-client=1.9.0
  # - requests=2.32.3
  # - aiohttp=3.13.1
  
  # UI: `msm gui` serves a prebuilt bundle, so only the server side is needed
  # here — node is a build dependency, not a runtime one.
  - flask=3.1.3
  - coolname=2.2.0 # readable workflow names: blazing-ape, crystalline-lake

  # UI via jupyterlab
  - jupyterlab=4.5.0
  - jupyterlab-lsp=5.2.0
  - python-lsp-server=1.13.2
  - jupyterlab-unfold=0.3.4
  - theme-material-darcula=1.0.3

  # common tools (not strictly dependencies)
  - pandas=2.3.3
  - openpyxl=3.1.5  # for pandas to read excel files
  # parquet, which is the fabfos lane's format end to end -- the GPR tables, the
  # bake, and every ecspr product. Without it `pytest tests/fabfos` does not
  # collect, because its tests import the research drivers that read them.
  - pyarrow=25.0.0
  - plotly=6.5.0
  - scipy=1.16.3
  
  # globus
  - globus-cli=3.40.0
  - globus-sdk=4.1.0

  # caching: canonical CBOR encoding + blake3 multihash keys
  - cbor2=5.6.5
  - blake3=0.4.1

# there can NOT be any pip dependencies,
# since those will not be installed with the conda package
