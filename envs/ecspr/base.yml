# The one dependency spec for ECSPr, feeding three consumers so they cannot drift:
# the dev conda env (`./dev.sh --iecspr`), the conda recipe's `requirements/run`
# (src/ecspr/conda_recipe/compile_recipe.py reads this file), and the container
# image (docker/ecspr/dockerfile creates the env from it).
#
# numpy<2 is not a preference. scikit-sparse's CHOLMOD binding and cobra jointly
# require it, which is also why docker/fabfos splits into two envs (polars needs
# numpy>=2) and why envs/build-refs-cobra.yml pins the same way. conda-forge's
# suitesparse is the reliable route to CHOLMOD on this class of host; pip is not.
#
# cobra is imported lazily (only ecspr.model.build's GEM/GPR paths touch it) and sksparse
# is guarded behind _HAVE_CHOLMOD, so both are honest runtime deps rather than
# import-time ones -- but a build that resolves without them silently drops to the
# splu fallback, so they are declared.
name: ecspr
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy<2
  - pandas=2.3.*
  - polars=1.43
  - pyarrow>=24
  - scipy=1.17.*
  - scikit-sparse
  - cobra=0.31.*
  # the test suite and the recipe compile it exercises; filtered back out of
  # the conda recipe's run requirements by conda_recipe/ecspr/compile_recipe.py
  - pytest
  - networkx
  - pyyaml
  - pip
