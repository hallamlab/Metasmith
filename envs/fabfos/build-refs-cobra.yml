# build-refs-cobra -- reading curated genome-scale models.
#
# Named by src/metasmith_libraries/resources/env/cobra.env (`conda: build-refs-cobra`)
# and used by build_references/transforms/benchmark/host_gpr_gem.py.
#
# Small on purpose. This env opens a BiGG JSON and reads reaction ids, gene ids and
# GPR rule strings out of it; it never solves anything, so no solver beyond cobra's
# bundled default is pinned. The rule string is CARRIED into the GPR table, not
# evaluated -- evaluating at bake time bakes in one condition, and `cobra.GPR.eval`
# takes the knocked-OUT set rather than the active one, an inversion that once
# reported more reactions live after a knockout than before.
#
# This is the ONE place the ECSPr engine is used as a package import rather than
# through its command line: the crosswalk sits inside a generated driver that also
# imports two buildlib modules, so shelling out from the middle of it would mean
# marshalling a cobra model through a file for no gain.
#
# `ecspr` IS NOT LISTED BELOW, AND THAT IS NOT AN OMISSION. The conda package is built
# but unpublished -- `./dev.sh -ue` is what would put it on the hallamlab channel, and
# until someone runs it a spec naming `ecspr` cannot be solved at all: the env fails to
# create and every step that needs it dies with "prefix does not exist", which reads
# like a broken installation rather than an unpublished package. `envs/setup_agent_env.sh`
# installs it EDITABLE from `src/ecspr` instead, exactly as `./dev.sh --iecspr` does for
# the `ecspr` env -- and editable is the better answer here anyway, since this env and a
# benchmark then run the same source tree. `scipy` stays listed because it arrived as an
# ecspr dependency: `ecspr.model.build` re-exports the solver at module scope, so importing the
# crosswalk pulls in `ecspr.model.graph`.
name: build-refs-cobra
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cobra=0.31.*
  - pandas=2.3.*
  - pyarrow>=24
  - numpy<2
  - scipy
  - requests
  - pip
