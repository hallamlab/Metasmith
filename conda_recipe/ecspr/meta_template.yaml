package:
  name: <NAME>
  version: <VERSION>

source:
  path: ../../src/ecspr

build:
  noarch: python
  number: 0
  string: <BUILD_STRING>
  script: {{ PYTHON }} -m pip install . -v --no-deps
  entry_points:
<ENTRY>

test:
  imports:
    - <NAME>
  commands:
    # NO `pip check`. conda-forge builds scikit-sparse 0.5.0 AGAINST numpy 1.26
    # -- that is its conda-level dependency -- but ships upstream's unpatched
    # wheel metadata saying `numpy>2.0`. pip check reads the metadata, not the
    # solve, so it fails on a claim conda-forge has already overruled, and the
    # binding demonstrably works (a real CHOLMOD solve is asserted at image
    # build time). Restore this if ecspr's own deps ever need policing.
    - <NAME> --help
    - <NAME> --where
    - <NAME> --version
  requires:
    - pip

requirements:
  host:
    - pip
<PYTHON>

  run:
<REQUIREMENTS>

about:
  home: https://github.com/<USER>/<NAME>
  summary: <SHORT_SUMMARY>
  license: 'gpl-v3'
  license_file: ../../LICENSE
