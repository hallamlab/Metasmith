ontology:
  doi: https://doi.org/10.1093/bioinformatics/btt113
  name: EDAM
  strict: false
  version: '1.25'
schema: v1
types:
  end_sequences_forward:
    properties:
      Data: fosmid end sequence
      Format: FASTA
      _:
      - fosmid forward end-sequences (fasta records keyed by insert_id)
      direction: forward
      ext: fna
  end_sequences_reverse:
    properties:
      Data: fosmid end sequence
      Format: FASTA
      _:
      - fosmid reverse end-sequences (fasta records keyed by insert_id)
      direction: reverse
      ext: fna
  end_sequences_table:
    properties:
      Format: JSON
      _:
      - fosmid ends manifest (insert_ids + ends_facing flag)
      ext: json
      fields:
      - ends_facing
      - insert_ids
  experiment:
    properties:
      logistics: to group the pooled assemblies + reads of one fosmid-recovery run
        (single grouping node; all inputs and intermediates descend from it)
  insert_coverage:
    properties:
      Format: CSV
      _:
      - read-mapping coverage summary of the pooled reads against the reference inserts;
        one row per (insert_id, pool) plus an "all"-pool aggregate, with depth/breadth
        stats
      ext: csv
      fields:
      - breadth_1x
      - breadth_5x
      - insert_id
      - length
      - mapped_bp
      - mean_depth
      - median_depth
      - pool
  insert_metadata:
    properties:
      Format: DIRECTORY
      _:
      - 'Everything about the recovered insert set that is not the sequence, as a
        directory of three files -- `inserts.csv` (centroid, length, ends, absorbed),
        `membership.csv` (contig, centroid, mi) and `junctions.tsv` (the pCC1fos backbone
        blast, verbatim and unfiltered). One product rather than three types because
        `resolve_inserts` is one job and these three tables only mean anything about
        the SAME run of it: a membership table read against another run''s inserts
        joins on ids that happen to look alike. Ids in all three are fully qualified
        -- `pool:assembler:contig[:start-end]` -- since a bare `k141_9` names a different
        contig in each of 35 pools.'
      content: insert set metadata
      files:
      - inserts.csv
      - junctions.tsv
      - membership.csv
  pool_size_estimate:
    properties:
      Format: JSON
      _:
      - fosmid pool size estimate
      ext: json
      fields:
      - size
      - size_with_singletons
  putative_inserts:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - final putative fosmid inserts -- the cross-assembler dedup of the junction-split
        contigs; same header-baked provenance convention, length-banded to the lambda
        window
      content: putative fosmid inserts
      ext: fna
      origin: assembler
  reference_inserts:
    properties:
      Data: nucleic acid sequence
      Format: FASTA
      _:
      - the canonical fosmid reference set -- putative inserts filtered to length
        >= min_insert_length (default 29 kb, the phage-packaging/lambda-window cutoff);
        the FASTA every downstream analysis (read-mapping, annotation, ECSPr) runs
        on
      content: reference fosmid inserts (length-filtered)
      ext: fna
      origin: assembler
  scaffold_report:
    properties:
      Format: CSV
      _:
      - fosmid scaffold mapping report
      ext: csv
      fields:
      - assemblers
      - contig_id
      - id
      - mapping_quality
      - original_id
      - paired
      - resolved_length
  scaffolds:
    properties:
      Data: fosmid scaffold
      Format: FASTA
      _:
      - end-aware scaffolded fosmid inserts
      ext: fna
  vector_backbone:
    properties:
      Data: vector backbone reference
      Format: FASTA
      _:
      - fosmid vector backbone reference fasta
      ext: fna
