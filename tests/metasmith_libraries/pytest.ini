[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests that require network access

filterwarnings =
    ignore::DeprecationWarning

# Don't recurse into cache directories
# `manual/` holds hand-run drivers, not tests. Several are named `test_*.py` and do
# their work at import time (deploy an agent, hit absolute paths that exist on one
# machine), so collecting them fails the whole run before a single test executes.
norecursedirs = cache test_msm_home test_data __pycache__ .git manual
